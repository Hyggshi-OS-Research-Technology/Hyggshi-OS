[options]
HoldPkg           = pacman glibc
Architecture      = auto
ParallelDownloads = 5
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Hyggshi Repository for Arch Components (HRAC)
# Source repo: https://github.com/Hyggshi-OS-Foundation/HRAC
# Local build cache in /opt/localrepo is used during mkarchiso
[hyggshi]
SigLevel = Optional TrustAll
Server = file:///opt/localrepo
# Remote HRAC repository (active once packages and db are published):
# Server = https://raw.githubusercontent.com/Hyggshi-OS-Foundation/HRAC/main/$arch
