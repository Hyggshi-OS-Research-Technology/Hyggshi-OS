name: Build Hyggshi OS ISO

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "Tên hiển thị của bản phân phối (đổi tên base linux — ghi vào os-release/hostname/GRUB/ISO label...)"
        required: false
        default: "Hyggshi OS"
      hyggshi_version:
        description: "Phiên bản RIÊNG của Hyggshi OS (không phải phiên bản base distro), ví dụ 1.0, 1.1, 2.0"
        required: false
        default: "1.0"
      hyggshi_codename:
        description: "Codename RIÊNG của Hyggshi OS (kiểu Ubuntu 'Jammy Jellyfish') — để trống sẽ tự chọn theo version (xem HYGGSHI_CODENAMES trong scripts/branding.sh, mặc định 'Sen Vàng')"
        required: false
        default: ""
      distro:
        description: "Bản phân phối gốc (base distro)"
        required: false
        type: choice
        options: [debian, ubuntu, linuxmint, alpine, arch, fedora]
        default: "debian"
      debian_version:
        description: "Phiên bản Debian (chỉ áp dụng khi distro = debian). 'testing' luôn trỏ đúng bản Testing hiện tại của Debian (rolling), không hardcode theo 1 codename cụ thể."
        required: false
        type: choice
        options: [trixie, bookworm, bullseye, testing]
        default: "trixie"
      ubuntu_version:
        description: "Phiên bản Ubuntu (chỉ áp dụng khi distro = ubuntu; Resolute Raccoon = Ubuntu 26.04 LTS)"
        required: false
        type: choice
        options: [resolute, noble, mantic, jammy, focal]
        default: "noble"
      mint_version:
        description: "Phiên bản Linux Mint (chỉ áp dụng khi distro = linuxmint)"
        required: false
        type: choice
        options: ["22", "21.3", "21.2"]
        default: "22"
      wallpaper_url:
        description: "Link ảnh wallpaper (dán trực tiếp URL .png/.jpg, vd link raw GitHub) — để trống dùng ảnh mặc định trong repo"
        required: false
        default: "https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Wallpaper.png?raw=true"
      logo_url:
        description: "Link ảnh distributor logo (dán trực tiếp URL .png/.jpg) — dùng cho icon hệ thống, để trống dùng ảnh mặc định trong repo"
        required: false
        default: "https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Logo.png?raw=true"
      plymouth_logo_url:
        description: "Link ảnh logo cho màn hình chờ boot Plymouth (dán trực tiếp URL .png/.jpg) — để trống sẽ dùng lại logo_url ở trên"
        required: false
        default: "https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Logo.png?raw=true"
      alpine_version:
        description: "Phiên bản Alpine (chỉ áp dụng khi distro = alpine — EXPERIMENTAL, mới bootstrap base rootfs, chưa có desktop/branding/iso riêng cho Alpine)"
        required: false
        type: choice
        options: ["v3.20", "v3.19", "edge"]
        default: "v3.20"
      fedora_version:
        description: "Phiên bản Fedora (chỉ áp dụng khi distro = fedora — EXPERIMENTAL, dùng dnf --installroot + dracut dmsquash-live, chưa test trên phần cứng/VM thật)"
        required: false
        type: choice
        options: ["41", "40", "rawhide"]
        default: "41"
      edition:
        description: "Edition (chỉnh thông số kernel — chỉ áp dụng khi distro = debian, arch hoặc fedora)"
        required: false
        type: choice
        options: [normal, developer, server, lite]
        default: "normal"
      desktop:
        description: "Desktop environment (6 lựa chọn)"
        required: false
        type: choice
        options: [xfce, kde, lxqt, gnome, mate, cinnamon]
        default: "xfce"
      panel_style:
        description: "Kiểu taskbar (chỉ áp dụng cho XFCE)"
        required: false
        type: choice
        options: [windows10, classic]
        default: "windows10"
      icon_theme:
        description: "Bộ icon (áp dụng cho XFCE/LXQt; Cinnamon luôn dùng Tela riêng, xem desktop.sh)"
        required: false
        type: choice
        options: [papirus, numix, breeze, adwaita, tela]
        default: "papirus"
      username:
        description: "Username mặc định trong live session"
        required: false
        default: "hyggshi"
      user_password:
        description: "Mật khẩu user (plaintext, chỉ dùng cho ISO test)"
        required: false
        default: "hyggshi"
      hostname:
        description: "Hostname máy"
        required: false
        default: "hyggshi-os"
      timezone:
        description: "Múi giờ (vd Asia/Ho_Chi_Minh, UTC)"
        required: false
        default: "Asia/Ho_Chi_Minh"
      # LƯU Ý: workflow_dispatch chỉ cho phép TỐI ĐA 25 `inputs` (giới hạn
      # cứng của GitHub Actions — vượt quá là toàn bộ workflow bị từ chối
      # với lỗi "Invalid workflow file" ngay từ lúc parse, chưa kịp chạy).
      # Vì vậy 6 toggle bật/tắt tính năng (browser/office/autologin/
      # autoscale/welcome wizard) được GỘP CHUNG vào 1 input CSV duy nhất
      # `feature_flags` thay vì 6 input `type: boolean` riêng — xem step
      # "Resolve feature_flags..." bên dưới, nơi CSV này được tách ra lại
      # thành đúng 6 biến INCLUDE_BROWSER/INCLUDE_OFFICE/AUTOLOGIN/
      # AUTOSCALE_DISPLAY/WELCOME_WIZARD/THEME_DAEMON như cũ — không script nào khác
      # (desktop.sh, welcome.sh...) phải đổi theo.
      feature_flags:
        description: "Các tính năng bật (danh sách cách nhau bằng dấu phẩy): browser, office, autologin, autoscale, welcome, theme-daemon, auto-theme. theme-daemon (C++/libxfconf, chạy nền) và auto-theme (bash + systemd timer, chạy mỗi 5 phút rồi thoát) là 2 CÁCH KHÁC NHAU cho cùng 1 việc (đổi wallpaper Sáng/Tối) — chỉ nên bật 1 trong 2. Vd dùng bản bash nhẹ: 'browser,autologin,autoscale,welcome,auto-theme'"
        required: false
        default: "browser,autologin,autoscale,welcome,auto-theme"
      extra_packages:
        description: "Gói apt thêm, cách nhau bằng dấu cách (vd: vlc gimp htop)"
        required: false
        default: ""
      build_nexwm:
        description: "Build & cài NexWM từ source (chroot, scripts/build-nexwm.sh) — KHÔNG mặc định, chỉ bật khi cần"
        type: boolean
        default: false
      release_iso:
        description: "Attach ISO to a GitHub Release?"
        type: boolean
        default: false
      debug_mode:
        description: "Bật debug (log chi tiết + xuất debug-info.txt kèm ISO)"
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/Build-Hyggshi-OS-ISO.yml"
      - "scripts/**"
      - "iso-config/**"

env:
  DISTRO_NAME: ${{ github.event.inputs.distro_name || 'Hyggshi OS' }}
  HYGGSHI_VERSION_ID: ${{ github.event.inputs.hyggshi_version || '1.0' }}
  # Trống = branding.sh tự chọn theo HYGGSHI_VERSION_ID (xem HYGGSHI_CODENAMES
  # trong scripts/branding.sh). Không phải codename base distro — cái đó vẫn
  # là $BASE_CODENAME (bookworm/noble/...), được set riêng ở build-<distro>.sh.
  HYGGSHI_CODENAME: ${{ github.event.inputs.hyggshi_codename || '' }}
  BASE_DISTRO: ${{ github.event.inputs.distro || 'debian' }}
  EDITION: ${{ github.event.inputs.edition || 'normal' }}
  # LƯU Ý: debian_version/ubuntu_version/mint_version/alpine_version KHÔNG đặt
  # ở đây. Nếu đặt cứng ở env cấp workflow, GitHub Actions in TOÀN BỘ 4 biến
  # ra log của MỌI step (kể cả 3 biến không liên quan tới distro đã chọn —
  # ví dụ chọn debian vẫn thấy UBUNTU_VERSION/MINT_VERSION/ALPINE_VERSION),
  # gây hiểu lầm là chúng có tác dụng. Thay vào đó, step "Resolve version
  # theo distro đã chọn" bên dưới chỉ export ĐÚNG 1 biến khớp với
  # $BASE_DISTRO vào $GITHUB_ENV — 3 biến còn lại không hề được set.
  ISO_FILENAME: "hyggshi-os-${{ github.run_number }}.iso"
  # Đường dẫn chroot dùng chung cho MỌI step (trước đây một số step dùng
  # literal "live-build/chroot", một số khác lại dùng "${CHROOT_DIR}" mà
  # biến này CHƯA từng được định nghĩa ở đâu -> expand ra rỗng -> lệnh
  # `sudo cp LICENSE "${CHROOT_DIR}/tmp/LICENSE"` thực chất chạy thành
  # `sudo cp LICENSE "/tmp/LICENSE"`, tức KHÔNG copy vào chroot. Định nghĩa
  # 1 lần ở đây và dùng thống nhất $CHROOT_DIR ở mọi nơi để tránh lệch nhau.
  CHROOT_DIR: "live-build/chroot"
  DE: ${{ github.event.inputs.desktop || 'xfce' }}
  PANEL_STYLE: ${{ github.event.inputs.panel_style || 'windows10' }}
  ICON_THEME: ${{ github.event.inputs.icon_theme || 'papirus' }}
  OS_USERNAME: ${{ github.event.inputs.username || 'hyggshi' }}
  OS_PASSWORD: ${{ github.event.inputs.user_password || 'hyggshi' }}
  OS_HOSTNAME: ${{ github.event.inputs.hostname || 'hyggshi-os' }}
  OS_TIMEZONE: ${{ github.event.inputs.timezone || 'Asia/Ho_Chi_Minh' }}
  # INCLUDE_BROWSER/INCLUDE_OFFICE/AUTOLOGIN/AUTOSCALE_DISPLAY/WELCOME_WIZARD/
  # THEME_DAEMON KHÔNG đặt ở đây (lý do giống DEBIAN_VERSION/UBUNTU_VERSION/... phía trên):
  # từ khi 6 input boolean này bị gộp chung thành 1 input CSV `feature_flags`
  # (để không vượt giới hạn 25 inputs của workflow_dispatch), 6 biến này chỉ
  # có thể tách ra được LÚC CHẠY, không phải lúc parse workflow — xem step
  # "Resolve feature_flags..." ở đầu job build-iso, nơi chúng được ghi vào
  # $GITHUB_ENV.
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || '' }}
  DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
  # Không gộp vào feature_flags (CSV) vì đây là toggle build-time riêng cho
  # NexWM, không phải feature bật/tắt trong desktop.sh. Mặc định false —
  # bước "[build-nexwm.sh]" bên dưới chỉ chạy khi input này = true.
  BUILD_NEXWM: ${{ github.event.inputs.build_nexwm || 'false' }}
  # Link ảnh dán trực tiếp qua input — branding.sh tự tải nếu không có sẵn
  # file cùng tên trong iso-config/branding/ (xem WALLPAPER_FILE/LOGO_FILE/
  # PLYMOUTH_LOGO_FILE trong branding.sh). PLYMOUTH_LOGO_URL để trống sẽ
  # fallback dùng LOGO_URL (branding.sh tự xử lý).
  WALLPAPER_URL: ${{ github.event.inputs.wallpaper_url || 'https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Wallpaper.png?raw=true' }}
  LOGO_URL: ${{ github.event.inputs.logo_url || 'https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Logo.png?raw=true' }}
  PLYMOUTH_LOGO_URL: ${{ github.event.inputs.plymouth_logo_url || '' }}

jobs:
  build-iso:
    runs-on: ubuntu-latest
    # Chỉ chạy cho các distro dùng debootstrap/apt (Debian/Ubuntu/Mint).
    # Alpine và Arch chạy ở 2 job riêng bên dưới, trong container gốc của
    # chính distro đó — xem ghi chú trong build-alpine.sh / build-arch.sh về
    # lý do (apk/pacman + keyring có sẵn, không cần giả lập trên Ubuntu).
    if: ${{ github.event.inputs.distro != 'alpine' && github.event.inputs.distro != 'arch' && github.event.inputs.distro != 'fedora' }}
    # debootstrap + chroot cần quyền root
    steps:
      - name: Checkout repo (scripts, config files, branding...)
        uses: actions/checkout@v4

      # HCL (Hyggshi Configuration Language) — parse + resolve + validate
      # iso-config/config/config.ini TRƯỚC khi bất kỳ step nào dùng $BASE_DISTRO.
      # --strict: nếu config.ini có lỗi (function tên sai, ${ref} không trỏ
      # đâu, 2 base cùng true, path fileinstall()/filecustom() không tồn
      # tại...) job FAIL NGAY Ở ĐÂY, không tốn 15-20 phút debootstrap rồi
      # mới biết config sai. Biến xuất ra đều có prefix HCL_ (HCL_BASE_DISTRO,
      # HCL_DESKTOP_ENV, HCL_SWAP_MB...) — CỐ Ý không trùng BASE_DISTRO/DESKTOP_ENV
      # ở dưới (lấy từ workflow_dispatch input) để không âm thầm đè giá trị
      # người dùng chọn trên UI Actions. Chỉ dùng tools/hcl_parser.py Python
      # stdlib, không cần pip install.
      - name: Validate & resolve config.ini (HCL)
        run: |
          python3 tools/hcl_parser.py iso-config/config/config.ini \
            --root "$GITHUB_WORKSPACE" \
            --emit-json /tmp/hcl-resolved.json \
            --emit-env "$GITHUB_ENV" \
            --strict

      - name: Upload resolved config.ini (debug)
        uses: actions/upload-artifact@v4
        with:
          name: hcl-resolved-config
          path: /tmp/hcl-resolved.json
          retention-days: 14

      - name: Validate Hyggshi OS version
        run: |
          if ! printf '%s' "$HYGGSHI_VERSION_ID" | grep -Eq '^[0-9]+([.][0-9]+)*$'; then
            echo "Lỗi: hyggshi_version phải là dạng số, ví dụ 1.0, 1.1 hoặc 2.0." >&2
            exit 1
          fi

      - name: Chmod +x cho toàn bộ scripts/
        run: find scripts -type f -name '*.sh' -exec chmod +x {} +

      # Chỉ export ĐÚNG 1 biến version khớp với $BASE_DISTRO. Các biến của
      # distro khác không hề tồn tại trong môi trường của các step sau —
      # không còn cảnh debian mà vẫn thấy UBUNTU_VERSION.
      - name: Resolve version theo distro đã chọn
        run: |
          case "$BASE_DISTRO" in
            debian)
              echo "DEBIAN_VERSION=${{ github.event.inputs.debian_version || 'trixie' }}" >> "$GITHUB_ENV" ;;
            ubuntu)
              echo "UBUNTU_VERSION=${{ github.event.inputs.ubuntu_version || 'noble' }}" >> "$GITHUB_ENV" ;;
            linuxmint)
              echo "MINT_VERSION=${{ github.event.inputs.mint_version || '22' }}" >> "$GITHUB_ENV" ;;
            *)
              echo "Distro không hợp lệ cho job build-iso: $BASE_DISTRO"
              exit 1 ;;
          esac

      # Tách input CSV `feature_flags` (xem ghi chú ở khối `inputs:` phía
      # trên) thành lại đúng 6 biến env như trước khi gộp — mọi step/script
      # phía dưới (desktop.sh, welcome.sh...) không cần biết gì về việc gộp
      # này, vẫn đọc INCLUDE_BROWSER/INCLUDE_OFFICE/AUTOLOGIN/
      # AUTOSCALE_DISPLAY/WELCOME_WIZARD/THEME_DAEMON như bình thường.
      - name: "Resolve feature_flags -> INCLUDE_BROWSER/INCLUDE_OFFICE/AUTOLOGIN/AUTOSCALE_DISPLAY/WELCOME_WIZARD/THEME_DAEMON/AUTO_THEME"
        run: |
          # Bọc thêm dấu phẩy ở 2 đầu để match "$1" bằng pattern "*,$1,*"
          # không bị dính nhầm token con (vd "autologin" không match nhầm
          # bên trong 1 token dài hơn nào đó).
          FLAGS=",${{ github.event.inputs.feature_flags || 'browser,autologin,autoscale,welcome,auto-theme' }},"
          has_flag() {
            case "$FLAGS" in
              *",$1,"*) echo true ;;
              *) echo false ;;
            esac
          }
          {
            echo "INCLUDE_BROWSER=$(has_flag browser)"
            echo "INCLUDE_OFFICE=$(has_flag office)"
            echo "AUTOLOGIN=$(has_flag autologin)"
            echo "AUTOSCALE_DISPLAY=$(has_flag autoscale)"
            echo "WELCOME_WIZARD=$(has_flag welcome)"
            echo "THEME_DAEMON=$(has_flag theme-daemon)"
            echo "AUTO_THEME=$(has_flag auto-theme)"
          } >> "$GITHUB_ENV"

      # === 1) BUILD: resolve distro, debootstrap, mount, apt sources ===
      # build.sh chỉ là dispatcher: nó source đúng scripts/distros/build-<distro>.sh
      # bên trong (xem log con "Bootstrap rootfs riêng cho: ..."); tên step ở
      # đây ghi rõ distro để không cần mở log ra mới biết file nào đã chạy.
      - name: "[build.sh -> scripts/distros/build-${{ github.event.inputs.distro || 'debian' }}.sh] Chuẩn bị base rootfs"
        run: bash scripts/build.sh

      # === 2) Copy scripts vào chroot (tách riêng khỏi bước chạy chroot bên
      # dưới, và dùng THỐNG NHẤT $CHROOT_DIR cho mọi lệnh copy — trước đây
      # desktop.sh/kernel-tuning.sh dùng literal "live-build/chroot/tmp/..."
      # còn LICENSE lại dùng "${CHROOT_DIR}" chưa được định nghĩa, nên LICENSE
      # không thực sự được copy vào chroot).
      - name: Copy scripts vào chroot
        run: |
          sudo cp scripts/desktop.sh "${CHROOT_DIR}/tmp/desktop.sh"
          sudo cp scripts/kernel-tuning.sh "${CHROOT_DIR}/tmp/kernel-tuning.sh"
          sudo cp scripts/fix-cinnamon-tela-persistence.sh "${CHROOT_DIR}/tmp/fix-cinnamon-tela-persistence.sh"
          sudo cp LICENSE "${CHROOT_DIR}/tmp/LICENSE"
          sudo rm -rf "${CHROOT_DIR}/tmp/packages"
          sudo cp -r iso-config/packages "${CHROOT_DIR}/tmp/packages"
          # Stage the repository's complete Calamares configuration.
          # desktop.sh will overwrite /etc/calamares with this exact tree
          # after the Calamares packages are installed.
          sudo rm -rf "${CHROOT_DIR}/tmp/calamares"
          sudo cp -a iso-config/calamares "${CHROOT_DIR}/tmp/calamares"
          # Stage installer branding so desktop.sh can rebrand the Calamares launcher.
          sudo cp iso-config/branding/Hyggshi-OS-Installer.png "${CHROOT_DIR}/tmp/Hyggshi-OS-Installer.png"
          sudo chmod 0644 "${CHROOT_DIR}/tmp/Hyggshi-OS-Installer.png"
          sudo chmod +x "${CHROOT_DIR}/tmp/desktop.sh"
          
      # === 3) DESKTOP: cài package/DE/user — chạy BÊN TRONG chroot ===
      - name: "[desktop.sh] Cài desktop environment (trong chroot)"
        run: |
          set -o pipefail
          # Chỉ để các gói/postinst cần pseudo-terminal nhìn thấy /dev/pts.
          # Firefox trên Ubuntu Resolute không dùng snap trong chroot nữa,
          # nhưng các package khác vẫn có thể cần pseudo-terminal.
          sudo mountpoint -q "${CHROOT_DIR}/dev/pts" || sudo mount --bind /dev/pts "${CHROOT_DIR}/dev/pts" || true
          sudo chroot "${CHROOT_DIR}" env \
            BASE_DISTRO="$BASE_DISTRO" \
            DE="$DE" \
            EDITION="$EDITION" \
            DEBUG_MODE="$DEBUG_MODE" \
            ICON_THEME="$ICON_THEME" \
            OS_USERNAME="$OS_USERNAME" \
            OS_PASSWORD="$OS_PASSWORD" \
            OS_HOSTNAME="$OS_HOSTNAME" \
            OS_TIMEZONE="$OS_TIMEZONE" \
            INCLUDE_BROWSER="$INCLUDE_BROWSER" \
            INCLUDE_OFFICE="$INCLUDE_OFFICE" \
            EXTRA_PACKAGES="$EXTRA_PACKAGES" \
            AUTOLOGIN="$AUTOLOGIN" \
            AUTOSCALE_DISPLAY="$AUTOSCALE_DISPLAY" \
            /tmp/desktop.sh 2>&1 | tee install-debug.log

      # === 3.1) CINNAMON: sửa Dark/Light + Cinnamon Spices ===
      # Debian Trixie hiện có thể vẫn cung cấp Cinnamon 6.4.10-2.
      # Bản này có lỗi Spices.py khi server Cinnamon trả response không có
      # Content-Length (HTTP chunked/gzip), làm int(None) -> TypeError.
      # Patch bên dưới là bản sửa 6.4-maintenance đã được đưa vào Cinnamon 6.4.14
      # và Debian trixie-updates. Không dùng regex/base64 để tránh lỗi build.
      - name: "[cinnamon-fix] Fix Dark/Light mode + Cinnamon Spices downloader"
        if: ${{ env.DE == 'cinnamon' }}
        run: |
          set -euo pipefail
          sudo chroot "${CHROOT_DIR}" /bin/bash -s <<'CHROOT_SCRIPT'
          set -e
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y --no-install-recommends \
            cinnamon cinnamon-common gnome-themes-extra \
            gsettings-desktop-schemas xdg-desktop-portal xdg-desktop-portal-xapp

          # Cố nâng Cinnamon nếu repository đã có bản fixed.
          apt-get install -y --only-upgrade cinnamon cinnamon-common || true

          SPICES="/usr/share/cinnamon/cinnamon-settings/bin/Spices.py"

          if [ -f "$SPICES" ]; then
            cp -a "$SPICES" "${SPICES}.hyggshi-backup"

            python3 - "$SPICES" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          original = source

          # 1. HTTP errors phải được xử lý bằng exception chuẩn.
          source = source.replace(
              "assert response.ok",
              "response.raise_for_status()",
              1,
          )

          # 2. Không được int(None) khi server không gửi Content-Length.
          source = source.replace(
              "totalSize = int(response.headers.get('content-length'))",
              "content_length = response.headers.get('content-length')\n"
              "            totalSize = int(content_length) if content_length else -1",
              1,
          )

          # 3. Progress bar phải có trạng thái pulse khi total size không biết.
          if "def _set_progressbar_pulse(self):" not in source:
              marker = "    def _set_progressbar_visible(self, visible):"
              method = (
                  "    def _set_progressbar_pulse(self):\n"
                  "        for progressbar in self.progressbars:\n"
                  "            progressbar.pulse()\n"
                  "\n"
              )
              if marker in source:
                  source = source.replace(marker, method + marker, 1)

          # Bản Cinnamon 6.4.x có đúng block này trong _update_progress.
          old_progress = (
              "        if current and total:\n"
              "            fraction = float(current) / float(total)\n"
              "            text = _(\"Downloading images:\") + f\" {current}/{total}\"\n"
              "            self._set_progressbar_text(text)\n"
              "        else:\n"
              "            fraction = count * blockSize / float((totalSize / blockSize + 1) * blockSize)\n"
              "\n"
              "        self._set_progressbar_fraction(fraction)"
          )

          new_progress = (
              "        if current and total:\n"
              "            fraction = float(current) / float(total)\n"
              "            text = _(\"Downloading images:\") + f\" {current}/{total}\"\n"
              "            self._set_progressbar_text(text)\n"
              "            self._set_progressbar_fraction(fraction)\n"
              "        elif totalSize == -1:\n"
              "            self._set_progressbar_pulse()\n"
              "        else:\n"
              "            fraction = count * blockSize / float((totalSize / blockSize + 1) * blockSize)\n"
              "            self._set_progressbar_fraction(fraction)"
          )

          if old_progress in source:
              source = source.replace(old_progress, new_progress, 1)

          if source != original:
              path.write_text(source, encoding="utf-8")
              print("Hyggshi OS: Cinnamon Spices.py patched successfully")
          else:
              print("Hyggshi OS: Cinnamon Spices.py đã có bản sửa, bỏ qua patch")
          PY
          fi

          # Không ép Cinnamon vào Dark hoặc Light.
          # Cho phép Cinnamon Settings quản lý lựa chọn Mixed/Dark/Light.
          mkdir -p /etc/dconf/db/local.d
          cat > /etc/dconf/db/local.d/00-hyggshi-cinnamon-color-scheme <<'EOF'
          [org/gnome/desktop/interface]
          color-scheme='default'

          [org/x/apps/portal]
          color-scheme='default'
          EOF

          dconf update || true

          # Thư mục theme cho user mới.
          mkdir -p /etc/skel/.local/share/themes
          mkdir -p /etc/skel/.themes
          mkdir -p /etc/skel/.local/share/cinnamon/themes
          CHROOT_SCRIPT

      # === 3.5) NEXWM: clone + build (make) + cài NexWM TỪ SOURCE, và tạo
      # đúng X11 session (/usr/share/xsessions/nexwm.desktop, Type=XSession)
      # — chạy BÊN TRONG chroot (giống desktop.sh/welcome.sh) vì binary +
      # session file cần nằm trong rootfs của ISO, không phải máy runner CI.
      # Chạy SONG SONG với bước cài .deb nexfetch/nexwm-binary.zip có sẵn ở
      # bước [install-ecosystem-for-hyggshi.sh] bên dưới — không xoá bước đó.
      # TUỲ CHỌN, KHÔNG mặc định: chỉ chạy khi input build_nexwm = true
      # (xem BUILD_NEXWM ở env cấp workflow) — build từ source tốn nhiều
      # thời gian CI hơn hẳn so với cài sẵn .deb ở bước ecosystem bên dưới.
      - name: "[build-nexwm.sh] Build & cài NexWM từ source (trong chroot)"
        if: ${{ env.BUILD_NEXWM == 'true' }}
        run: |
          set -o pipefail
          sudo cp scripts/build-nexwm.sh "${CHROOT_DIR}/tmp/build-nexwm.sh"
          sudo chmod +x "${CHROOT_DIR}/tmp/build-nexwm.sh"
          sudo chroot "${CHROOT_DIR}" env \
            DEBUG_MODE="$DEBUG_MODE" \
            /tmp/build-nexwm.sh 2>&1 | tee nexwm-build-debug.log

      # === 4) ECOSYSTEM: mở app-for-hyggshi/*.zip, cài .deb, cấu hình
      # config.json (logo/plugin/module) cho nexfetch — PHẢI chạy BÊN TRONG
      # chroot (giống desktop.sh), nếu không apt install/ghi config.json sẽ
      # chỉ tác động lên máy runner CI chứ không nằm trong ISO cuối cùng.
      # LƯU Ý: logo dùng file ASCII có sẵn TRONG gói nexfetch
      # (/usr/share/nexfetch/logos/hyggshi_OS.txt, do chính .deb cài vào) nên
      # không cần copy iso-config/branding/Logo.png vào chroot nữa.
      - name: "[install-ecosystem-for-hyggshi.sh] Cài hệ sinh thái ứng dụng Hyggshi (nexfetch...)"
        run: |
          set -o pipefail
          sudo mkdir -p "${CHROOT_DIR}/tmp/app-for-hyggshi"
          sudo cp -r app-for-hyggshi/. "${CHROOT_DIR}/tmp/app-for-hyggshi/"
          sudo cp scripts/install-ecosystem-for-hyggshi.sh "${CHROOT_DIR}/tmp/install-ecosystem-for-hyggshi.sh"
          sudo chmod +x "${CHROOT_DIR}/tmp/install-ecosystem-for-hyggshi.sh"
          sudo chroot "${CHROOT_DIR}" env \
            DEBUG_MODE="$DEBUG_MODE" \
            APP_DIR="/tmp/app-for-hyggshi" \
            /tmp/install-ecosystem-for-hyggshi.sh 2>&1 | tee ecosystem-debug.log

      # === 4.5) WELCOME: build trực tiếp source đã commit trong
      # app-for-hyggshi/hyggshi-welcome/. KHÔNG chạy make-welcome.sh vì
      # script generator cũ có thể ghi đè source versioned (ví dụ 1.2.0).
      # welcome.sh chỉ build + install source đã được commit vào chroot.
      - name: "[welcome.sh] Build & cài Hyggshi Welcome từ source đã commit (trong chroot)"
        if: ${{ env.WELCOME_WIZARD == 'true' }}
        run: |
          set -o pipefail
          sudo mkdir -p "${CHROOT_DIR}/tmp/hyggshi-welcome-src"
          sudo cp -r app-for-hyggshi/hyggshi-welcome/. "${CHROOT_DIR}/tmp/hyggshi-welcome-src/"
          sudo cp app-for-hyggshi/welcome.sh "${CHROOT_DIR}/tmp/welcome.sh"
          sudo chmod +x "${CHROOT_DIR}/tmp/welcome.sh"
          sudo chroot "${CHROOT_DIR}" env \
            DEBUG_MODE="$DEBUG_MODE" \
            SRC_DIR="/tmp/hyggshi-welcome-src" \
            /tmp/welcome.sh 2>&1 | tee welcome-debug.log

      # === 4.6) THEME DAEMON: sinh source (host, không cần libxfconf) rồi
      # build+cài THẬT bên trong chroot (theme-daemon.sh — cần đúng
      # glibc/libxfconf của ISO cuối cùng, không phải của runner). Tách 2
      # bước giống hệt lý do make-welcome.sh/welcome.sh ở trên. Đặt SAU
      # branding.sh về mặt logic thì hợp lý hơn (daemon chỉ đọc wallpaper
      # branding.sh copy vào, không phụ thuộc thứ tự build), nhưng để CÙNG
      # khối "app-for-hyggshi" build ở đây cho nhất quán với welcome.
      - name: "[make-theme-daemon.sh] Sinh source code Hyggshi Theme Daemon (C++/xfconf)"
        if: ${{ env.THEME_DAEMON == 'true' }}
        run: bash scripts/make-theme-daemon.sh

      - name: "[theme-daemon.sh] Build & cài Hyggshi Theme Daemon (trong chroot)"
        if: ${{ env.THEME_DAEMON == 'true' }}
        run: |
          set -o pipefail
          sudo mkdir -p "${CHROOT_DIR}/tmp/hyggshi-theme-daemon-src"
          sudo cp -r app-for-hyggshi/hyggshi-theme-daemon/. "${CHROOT_DIR}/tmp/hyggshi-theme-daemon-src/"
          sudo cp app-for-hyggshi/theme-daemon.sh "${CHROOT_DIR}/tmp/theme-daemon.sh"
          sudo chmod +x "${CHROOT_DIR}/tmp/theme-daemon.sh"
          sudo chroot "${CHROOT_DIR}" env \
            DEBUG_MODE="$DEBUG_MODE" \
            SRC_DIR="/tmp/hyggshi-theme-daemon-src" \
            /tmp/theme-daemon.sh 2>&1 | tee theme-daemon-debug.log

      # === 4.7) AUTO THEME: bản thay thế nhẹ cho theme-daemon (bash +
      # systemd timer, xem scripts/make-auto-theme.sh) — KHÔNG build gì cả
      # (không cmake/libxfconf), auto-theme.sh chỉ copy file + systemctl
      # enable nên không cần tách riêng thành 2 bước sinh-source/build như
      # welcome.sh & theme-daemon.sh, nhưng vẫn giữ đúng pattern
      # make-*.sh (host) + *.sh (chroot) để nhất quán với 2 cái kia.
      - name: "[make-auto-theme.sh] Sinh source code Hyggshi Auto Theme (bash)"
        if: ${{ env.AUTO_THEME == 'true' }}
        run: bash scripts/make-auto-theme.sh

      - name: "[auto-theme.sh] Cài Hyggshi Auto Theme (trong chroot, không cần build)"
        if: ${{ env.AUTO_THEME == 'true' }}
        run: |
          set -o pipefail
          sudo mkdir -p "${CHROOT_DIR}/tmp/hyggshi-theme-src"
          sudo cp -r app-for-hyggshi/hyggshi-theme/. "${CHROOT_DIR}/tmp/hyggshi-theme-src/"
          sudo cp app-for-hyggshi/auto-theme.sh "${CHROOT_DIR}/tmp/auto-theme.sh"
          sudo chmod +x "${CHROOT_DIR}/tmp/auto-theme.sh"
          sudo chroot "${CHROOT_DIR}" env \
            DEBUG_MODE="$DEBUG_MODE" \
            SRC_DIR="/tmp/hyggshi-theme-src" \
            /tmp/auto-theme.sh 2>&1 | tee auto-theme-debug.log

      # === 5) BRANDING: wallpaper, logo, os-release, panel, autostart ===
      - name: "[branding.sh] Wallpaper / logo / rebrand / panel"
        run: |
          set -o pipefail
          bash scripts/branding.sh 2>&1 | tee branding-debug.log

      - name: Collect debug info (chỉ khi debug_mode = true)
        if: ${{ env.DEBUG_MODE == 'true' }}
        run: |
          CHROOT="${CHROOT_DIR}"
          {
            echo "===== Inputs / env ====="
            echo "DISTRO_NAME=$DISTRO_NAME | EDITION=$EDITION"
            echo "BASE_DISTRO=$BASE_DISTRO | BASE_CODENAME=$BASE_CODENAME | DISTRO_LABEL=$DISTRO_LABEL"
            echo "HYGGSHI_CODENAME=$HYGGSHI_CODENAME (trống nếu build tự chọn — xem branding-debug.log để biết giá trị thật đã dùng)"
            echo "DE=$DE | PANEL_STYLE=$PANEL_STYLE | ICON_THEME=$ICON_THEME"
            echo "OS_USERNAME=$OS_USERNAME | OS_HOSTNAME=$OS_HOSTNAME | OS_TIMEZONE=$OS_TIMEZONE"
            echo

            echo "===== Disk usage (runner) ====="
            df -h
            echo

            echo "===== iso-config/branding contents ====="
            find iso-config/branding -type f -exec ls -la {} \; 2>/dev/null || echo "(không có thư mục iso-config/branding)"
            echo

            echo "===== /etc/apt/sources.list trong chroot ====="
            sudo cat "$CHROOT/etc/apt/sources.list" 2>/dev/null || true
            echo

            echo "===== /etc/os-release trong chroot ====="
            sudo cat "$CHROOT/etc/os-release" 2>/dev/null || true
            echo

            echo "===== /etc/lsb-release trong chroot ====="
            sudo cat "$CHROOT/etc/lsb-release" 2>/dev/null || true
            echo

            echo "===== backgrounds/hyggshi trong chroot ====="
            sudo ls -la "$CHROOT/usr/share/backgrounds/hyggshi/" 2>/dev/null || true
            echo

            echo "===== distributor-logo đã ghi vào hicolor (128x128) ====="
            sudo ls -la "$CHROOT/usr/share/icons/hicolor/128x128/apps/" 2>/dev/null | grep distributor || true
            echo

            echo "===== /etc/xdg/autostart (system-wide) ====="
            sudo ls -la "$CHROOT/etc/xdg/autostart/" 2>/dev/null || true
            echo

            echo "===== hyggshi-welcome (binary + desktop entry) ====="
            sudo ls -la "$CHROOT/usr/bin/hyggshi-welcome" 2>/dev/null || echo "(chưa cài — WELCOME_WIZARD=false hoặc build lỗi)"
            sudo cat "$CHROOT/usr/share/applications/hyggshi-welcome.desktop" 2>/dev/null || true
            echo

            echo "===== hyggshi-theme-daemon (binary + systemd preset) ====="
            sudo ls -la "$CHROOT/usr/bin/hyggshi-theme-daemon" 2>/dev/null || echo "(chưa cài — THEME_DAEMON=false hoặc build lỗi)"
            sudo cat "$CHROOT/usr/lib/systemd/user-preset/90-hyggshi-theme-daemon.preset" 2>/dev/null || true

            echo "===== hyggshi-auto-theme (bash script + systemd timer) ====="
            sudo ls -la "$CHROOT/usr/local/bin/hyggshi-auto-theme" 2>/dev/null || echo "(chưa cài — AUTO_THEME=false hoặc cài lỗi)"
            sudo ls -la "$CHROOT/etc/systemd/system/timers.target.wants/hyggshi-auto-theme.timer" 2>/dev/null || true
            sudo cat "$CHROOT/etc/hyggshi/theme.conf" 2>/dev/null || true
            echo

            echo "===== update-alternatives desktop-background ====="
            sudo chroot "$CHROOT" update-alternatives --display desktop-background 2>&1 || true
            echo

            # LƯU Ý: sudo find có thể liệt kê được cả file bên trong
            # $CHROOT/home/<user> (thường mode 700), nhưng `cat` KHÔNG sudo
            # sẽ bị "Permission denied" khi đọc file trong đó -> exit code
            # khác 0 -> vì đây là lệnh CUỐI trong pipe (while), dưới `set -e`
            # (shell mặc định của GitHub Actions) toàn bộ step sẽ bị abort
            # NGAY LẬP TỨC và không in được dòng nào ra debug-info.txt.
            # Fix: thêm `sudo` vào cat, và `|| true` chặn an toàn cho cả pipeline.
            echo "===== Mọi file xfce4-desktop.xml tìm thấy trong hệ thống ====="
            sudo find "$CHROOT/etc/xdg" "$CHROOT/usr/share" "$CHROOT/home" \
              -name "xfce4-desktop.xml" 2>/dev/null | while read -r f; do
              echo "--- $f ---"
              sudo cat "$f" 2>/dev/null
            done || true
          } > debug-info.txt

          echo "----- debug-info.txt preview -----"
          cat debug-info.txt

      - name: Upload debug artifact (log build + debug-info.txt)
        if: ${{ env.DEBUG_MODE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-debug
          path: |
            install-debug.log
            nexwm-build-debug.log
            ecosystem-debug.log
            welcome-debug.log
            branding-debug.log
            debug-info.txt
          retention-days: 14
          if-no-files-found: ignore

      # === 6) ISO: unmount, squashfs, grub, đóng gói ISO ===
      - name: "[iso.sh] Build squashfs + ISO bootable"
        run: bash scripts/iso.sh

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-iso
          path: |
            ${{ env.ISO_FILENAME }}
            ${{ env.ISO_FILENAME }}.sha256
          retention-days: 14

      - name: Attach ISO to GitHub Release (optional)
        if: ${{ github.event.inputs.release_iso == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ISO_FILENAME }}
            ${{ env.ISO_FILENAME }}.sha256
          tag_name: "hyggshi-os-${{ github.run_number }}"
          name: "Hyggshi OS build #${{ github.run_number }}"

  # ============================================================
  # Job riêng cho Alpine: chạy TRONG container alpine:latest thay vì giả lập
  # apk trên ubuntu-latest. Trong container này tiến trình đã là root, apk đã
  # có sẵn — build-alpine.sh không cần sudo / apk-tools-static nữa.
  # EXPERIMENTAL: chỉ dựng base rootfs, chưa có desktop/branding/ISO riêng cho
  # Alpine (xem ghi chú trong scripts/distros/build-alpine.sh).
  # ============================================================
  build-alpine:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.distro == 'alpine' }}
    container:
      image: ${{ (github.event.inputs.alpine_version == 'v3.19' && 'alpine:3.19') || (github.event.inputs.alpine_version == 'edge' && 'alpine:edge') || 'alpine:3.20' }}
    steps:
      - name: Cài build tools (apk add trong container)
        run: |
          apk add --no-cache bash coreutils curl xz tar squashfs-tools grub grub-bios xorriso

      - name: Checkout repo (scripts, config files, branding...)
        uses: actions/checkout@v4

      - name: Resolve Alpine version
        run: echo "ALPINE_VERSION=${{ github.event.inputs.alpine_version || 'v3.20' }}" >> "$GITHUB_ENV"

      - name: Chmod +x cho scripts/distros/build-alpine.sh
        run: chmod +x scripts/distros/build-alpine.sh

      - name: "[build-alpine.sh] Chuẩn bị base rootfs (native, trong container alpine)"
        run: bash scripts/distros/build-alpine.sh

      # Alpine hiện chỉ dừng ở base rootfs (xem build-alpine.sh) — đóng gói
      # rootfs thành tarball thay vì cố build ISO, để job kết thúc THÀNH
      # CÔNG và có artifact xem được.
      - name: Đóng gói base rootfs thành tarball
        run: |
          echo "Alpine base rootfs build xong — chưa có desktop/branding/ISO cho Alpine."
          tar -C live-build/chroot -cJf hyggshi-os-alpine-rootfs.tar.xz .
          ls -lh hyggshi-os-alpine-rootfs.tar.xz

      - name: Upload Alpine rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-alpine-rootfs
          path: hyggshi-os-alpine-rootfs.tar.xz
          retention-days: 14

  # ============================================================
  # Job riêng cho Arch: chạy TRONG container archlinux:latest, dùng
  # mkarchiso (công cụ chính chủ archlinux.org) để build ISO THẬT (bootable),
  # thay vì chỉ dựng base rootfs như trước. Xem chi tiết trong
  # scripts/distros/build-arch-iso.sh.
  # ============================================================
  build-arch:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.distro == 'arch' }}
    container:
      image: archlinux:latest
      # mkarchiso (giống pacstrap) tự mount /proc, /sys, /dev bind vào bên
      # trong target để chroot vào cài gói — việc mount này cần CAP_SYS_ADMIN,
      # nhưng container mặc định trên GitHub Actions KHÔNG có capability đó
      # (Docker rút gọn quyền theo mặc định) -> chết với "mount: ... permission
      # denied" / "ERROR: failed to setup chroot". --privileged cấp lại đủ
      # quyền để mkarchiso tự mount được.
      options: --privileged
    steps:
      - name: Checkout repo (scripts, config files, branding...)
        uses: actions/checkout@v4

      - name: Chmod +x cho scripts/distros/build-arch-iso.sh
        run: chmod +x scripts/distros/build-arch-iso.sh

      - name: "[build-arch-iso.sh] Build ISO bằng mkarchiso"
        run: bash scripts/distros/build-arch-iso.sh

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-iso
          path: ${{ env.ISO_FILENAME }}
          retention-days: 14

      - name: Attach ISO to GitHub Release (optional)
        if: ${{ github.event.inputs.release_iso == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ISO_FILENAME }}
          tag_name: "hyggshi-os-${{ github.run_number }}"
          name: "Hyggshi OS build #${{ github.run_number }}"

  # ============================================================
  # Job riêng cho Fedora: chạy TRONG container fedora:$FEDORA_VERSION
  # (--privileged, giống build-arch — build-fedora.sh cần mount --bind
  # /dev /proc /sys /run để chroot chạy đúng rpm %post scriptlet của
  # systemd/glibc/kernel + dracut). Dùng dnf --installroot + dracut
  # dmsquash-live (đúng công nghệ Fedora Live/Workstation ISO thật) — xem
  # chi tiết + cảnh báo EXPERIMENTAL trong scripts/distros/build-fedora.sh.
  # ============================================================
  build-fedora:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.distro == 'fedora' }}
    container:
      image: ${{ (github.event.inputs.fedora_version == '40' && 'fedora:40') || (github.event.inputs.fedora_version == 'rawhide' && 'fedora:rawhide') || 'fedora:41' }}
      options: --privileged
    steps:
      - name: "Cài build tools trên HOST (container fedora — build-fedora.sh chỉ cài vào --installroot, không tự cài công cụ cho chính host)"
        run: |
          # LƯU Ý: grub2-mkrescue KHÔNG nằm trong gói "grub2-tools" — trên Fedora
          # nó được đóng gói riêng trong "grub2-tools-extra" (khác Debian, nơi
          # grub-mkrescue nằm ngay trong grub-common/grub-pc-bin). Thiếu gói này
          # gây lỗi "grub2-mkrescue: command not found" ở bước build ISO cuối.
          dnf install -y --setopt=install_weak_deps=False \
            squashfs-tools grub2-tools grub2-tools-extra grub2-pc-modules grub2-efi-x64-modules \
            xorriso mtools rsync util-linux

      - name: Checkout repo (scripts, config files, branding...)
        uses: actions/checkout@v4

      - name: Resolve Fedora version
        run: echo "FEDORA_VERSION=${{ github.event.inputs.fedora_version || '41' }}" >> "$GITHUB_ENV"

      - name: Chmod +x cho scripts/distros/build-fedora.sh
        run: chmod +x scripts/distros/build-fedora.sh

      - name: "[build-fedora.sh] Bootstrap dnf --installroot + build ISO (dracut dmsquash-live)"
        run: bash scripts/distros/build-fedora.sh

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-iso
          path: ${{ env.ISO_FILENAME }}
          retention-days: 14

      - name: Attach ISO to GitHub Release (optional)
        if: ${{ github.event.inputs.release_iso == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ISO_FILENAME }}
          tag_name: "hyggshi-os-${{ github.run_number }}"
          name: "Hyggshi OS build #${{ github.run_number }}"
