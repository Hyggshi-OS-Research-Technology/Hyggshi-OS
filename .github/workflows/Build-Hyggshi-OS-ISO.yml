name: Build Hyggshi OS ISO

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "Tên hiển thị của bản phân phối (đổi tên base linux — ghi vào os-release/hostname/GRUB/ISO label...)"
        required: false
        default: "Hyggshi OS"
      hyggshi_version:
        description: "Phiên bản RIÊNG của Hyggshi OS (không phải phiên bản base distro), ví dụ 1.0, 1.1, 2.0"
        required: false
        default: "1.0"
      hyggshi_codename:
        description: "Codename RIÊNG của Hyggshi OS (kiểu Ubuntu 'Jammy Jellyfish') — để trống sẽ tự chọn theo version (xem HYGGSHI_CODENAMES trong scripts/branding.sh, mặc định 'Sen Vàng')"
        required: false
        default: ""
      distro:
        description: "Bản phân phối gốc (base distro)"
        required: false
        type: choice
        options: [debian, ubuntu, linuxmint, alpine, arch, fedora]
        default: "debian"
      debian_version:
        description: "Phiên bản Debian (chỉ áp dụng khi distro = debian). 'testing' luôn trỏ đúng bản Testing hiện tại của Debian (rolling), không hardcode theo 1 codename cụ thể."
        required: false
        type: choice
        options: [trixie, bookworm, bullseye, testing]
        default: "trixie"
      ubuntu_version:
        description: "Phiên bản Ubuntu (chỉ áp dụng khi distro = ubuntu; Resolute Raccoon = Ubuntu 26.04 LTS)"
        required: false
        type: choice
        options: [resolute, noble, mantic, jammy, focal]
        default: "noble"
      mint_version:
        description: "Phiên bản Linux Mint (chỉ áp dụng khi distro = linuxmint)"
        required: false
        type: choice
        options: ["22", "21.3", "21.2"]
        default: "22"
      wallpaper_url:
        description: "Link ảnh wallpaper (dán trực tiếp URL .png/.jpg, vd link raw GitHub) — để trống dùng ảnh mặc định trong repo"
        required: false
        default: "https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Wallpaper.png?raw=true"
      logo_url:
        description: "Link ảnh distributor logo (dán trực tiếp URL .png/.jpg) — dùng cho icon hệ thống, để trống dùng ảnh mặc định trong repo"
        required: false
        default: "https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Logo.png?raw=true"
      plymouth_logo_url:
        description: "Link ảnh logo cho màn hình chờ boot Plymouth (dán trực tiếp URL .png/.jpg) — để trống sẽ dùng lại logo_url ở trên"
        required: false
        default: "https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Logo.png?raw=true"
      alpine_version:
        description: "Phiên bản Alpine (chỉ áp dụng khi distro = alpine — EXPERIMENTAL, mới bootstrap base rootfs, chưa có desktop/branding/iso riêng cho Alpine)"
        required: false
        type: choice
        options: ["v3.20", "v3.19", "edge"]
        default: "v3.20"
      fedora_version:
        description: "Phiên bản Fedora (chỉ áp dụng khi distro = fedora — EXPERIMENTAL, dùng dnf --installroot + dracut dmsquash-live, chưa test trên phần cứng/VM thật)"
        required: false
        type: choice
        options: ["41", "40", "rawhide"]
        default: "41"
      edition:
        description: "Edition (chỉnh thông số kernel — chỉ áp dụng khi distro = debian, arch hoặc fedora)"
        required: false
        type: choice
        options: [normal, developer, server, lite]
        default: "normal"
      desktop:
        description: "Desktop environment (auto = tự động theo config.ini / Build-all-github-actions, all = build song song cả 6 DEs, hoặc chọn 1 DE cụ thể)"
        required: false
        type: choice
        options: [auto, all, xfce, kde, lxqt, gnome, mate, cinnamon]
        default: "auto"
      panel_style:
        description: "Kiểu taskbar (chỉ áp dụng cho XFCE)"
        required: false
        type: choice
        options: [windows10, classic]
        default: "windows10"
      icon_theme:
        description: "Bộ icon (áp dụng cho XFCE/LXQt; Cinnamon luôn dùng Tela riêng, xem desktop.sh)"
        required: false
        type: choice
        options: [papirus, numix, breeze, adwaita, tela]
        default: "papirus"
      username:
        description: "Username mặc định trong live session"
        required: false
        default: "hyggshi"
      user_password:
        description: "Mật khẩu user (plaintext, chỉ dùng cho ISO test)"
        required: false
        default: "hyggshi"
      hostname:
        description: "Hostname máy"
        required: false
        default: "hyggshi-os"
      timezone:
        description: "Múi giờ (vd Asia/Ho_Chi_Minh, UTC)"
        required: false
        default: "Asia/Ho_Chi_Minh"
      feature_flags:
        description: "Các tính năng bật (danh sách cách nhau bằng dấu phẩy): browser, office, autologin, autoscale, welcome, theme-daemon, auto-theme, arm64. theme-daemon (C++/libxfconf, chạy nền) và auto-theme (bash + systemd timer, chạy mỗi 5 phút rồi thoát) là 2 CÁCH KHÁC NHAU cho cùng 1 việc (đổi wallpaper Sáng/Tối) — chỉ nên bật 1 trong 2. arm64: build kiến trúc arm64 thay vì amd64 mặc định — CHỈ áp dụng khi distro = debian (xem [Architecture] trong config.ini + scripts/arch.sh); Ubuntu/Mint/Alpine/Arch/Fedora job chưa hỗ trợ, luôn build amd64 dù có cờ này. Chậm hơn amd64 đáng kể (QEMU binfmt emulation) và ISO chưa có UEFI Secure Boot signing. Vd dùng bản bash nhẹ: 'browser,autologin,autoscale,welcome,auto-theme'"
        required: false
        default: "browser,autologin,autoscale,welcome,auto-theme"
      extra_packages:
        description: "Gói apt thêm, cách nhau bằng dấu cách (vd: vlc gimp htop)"
        required: false
        default: ""
      build_nexwm:
        description: "Build & cài NexWM từ source (chroot, scripts/build-nexwm.sh) — KHÔNG mặc định, chỉ bật khi cần"
        type: boolean
        default: false
      release_iso:
        description: "Attach ISO to a GitHub Release?"
        type: boolean
        default: false
      debug_mode:
        description: "Bật debug (log chi tiết + xuất debug-info.txt kèm ISO)"
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/Build-Hyggshi-OS-ISO.yml"
      - "scripts/**"
      - "iso-config/**"

env:
  DISTRO_NAME: ${{ github.event.inputs.distro_name || 'Hyggshi OS' }}
  HYGGSHI_VERSION_ID: ${{ github.event.inputs.hyggshi_version || '1.0' }}
  HYGGSHI_CODENAME: ${{ github.event.inputs.hyggshi_codename || '' }}
  BASE_DISTRO: ${{ github.event.inputs.distro || 'debian' }}
  EDITION: ${{ github.event.inputs.edition || 'normal' }}
  ISO_FILENAME: "hyggshi-os-${{ github.run_number }}.iso"
  CHROOT_DIR: "live-build/chroot"
  DE: ${{ github.event.inputs.desktop || 'xfce' }}
  PANEL_STYLE: ${{ github.event.inputs.panel_style || 'windows10' }}
  ICON_THEME: ${{ github.event.inputs.icon_theme || 'papirus' }}
  OS_USERNAME: ${{ github.event.inputs.username || 'hyggshi' }}
  OS_PASSWORD: ${{ github.event.inputs.user_password || 'hyggshi' }}
  OS_HOSTNAME: ${{ github.event.inputs.hostname || 'hyggshi-os' }}
  OS_TIMEZONE: ${{ github.event.inputs.timezone || 'Asia/Ho_Chi_Minh' }}
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || '' }}
  DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'true' }}
  BUILD_NEXWM: ${{ github.event.inputs.build_nexwm || 'false' }}
  WALLPAPER_URL: ${{ github.event.inputs.wallpaper_url || 'https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Wallpaper.png?raw=true' }}
  LOGO_URL: ${{ github.event.inputs.logo_url || 'https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Logo.png?raw=true' }}
  PLYMOUTH_LOGO_URL: ${{ github.event.inputs.plymouth_logo_url || '' }}

jobs:
  matrix-prep:
    name: "Chuẩn bị Desktop Matrix"
    runs-on: ubuntu-26.04
    if: ${{ github.event.inputs.distro != 'alpine' && github.event.inputs.distro != 'arch' && github.event.inputs.distro != 'fedora' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      is_matrix: ${{ steps.set-matrix.outputs.is_matrix }}
    steps:
      - name: Checkout repo (scripts, config files, branding...)
        uses: actions/checkout@v4

      - name: Xác định Desktop Matrix từ config.ini / input
        id: set-matrix
        run: |
          python3 tools/hcl_parser.py iso-config/config/config.ini \
            --root "$GITHUB_WORKSPACE" \
            --de-override "${{ github.event.inputs.desktop || 'auto' }}" \
            --print-matrix-json

  build-iso:
    name: "Build ISO (${{ matrix.desktop }})"
    needs: matrix-prep
    runs-on: ubuntu-26.04
    if: ${{ github.event.inputs.distro != 'alpine' && github.event.inputs.distro != 'arch' && github.event.inputs.distro != 'fedora' }}
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJson(needs.matrix-prep.outputs.matrix) }}
    env:
      DE: ${{ matrix.desktop }}
      ISO_FILENAME: "hyggshi-os-${{ matrix.desktop }}-${{ github.run_number }}.iso"
    steps:
      - name: Checkout repo (scripts, config files, branding...)
        uses: actions/checkout@v4

      - name: Validate & resolve config.ini (HCL)
        run: |
          python3 tools/hcl_parser.py iso-config/config/config.ini \
            --root "$GITHUB_WORKSPACE" \
            --de-override "$DE" \
            --emit-json /tmp/hcl-resolved.json \
            --emit-env "$GITHUB_ENV" \
            --strict

      - name: Upload resolved config.ini (debug)
        uses: actions/upload-artifact@v4
        with:
          name: hcl-resolved-config-${{ matrix.desktop }}
          path: /tmp/hcl-resolved.json
          retention-days: 14

      - name: Validate Hyggshi OS version
        run: |
          if ! printf '%s' "$HYGGSHI_VERSION_ID" | grep -Eq '^[0-9]+([.][0-9]+)*$'; then
            echo "Lỗi: hyggshi_version phải là dạng số, ví dụ 1.0, 1.1 hoặc 2.0." >&2
            exit 1
          fi

      - name: Chmod +x cho toàn bộ scripts/
        run: find scripts -type f -name '*.sh' -exec chmod +x {} +

      - name: Resolve version theo distro đã chọn
        run: |
          case "$BASE_DISTRO" in
            debian)
              echo "DEBIAN_VERSION=${{ github.event.inputs.debian_version || 'trixie' }}" >> "$GITHUB_ENV" ;;
            ubuntu)
              echo "UBUNTU_VERSION=${{ github.event.inputs.ubuntu_version || 'noble' }}" >> "$GITHUB_ENV" ;;
            linuxmint)
              echo "MINT_VERSION=${{ github.event.inputs.mint_version || '22' }}" >> "$GITHUB_ENV" ;;
            *)
              echo "Distro không hợp lệ cho job build-iso: $BASE_DISTRO"
              exit 1 ;;
          esac

      - name: "Resolve feature_flags -> INCLUDE_BROWSER/INCLUDE_OFFICE/AUTOLOGIN/AUTOSCALE_DISPLAY/WELCOME_WIZARD/THEME_DAEMON/AUTO_THEME/ARCH"
        run: |
          FLAGS=",${{ github.event.inputs.feature_flags || 'browser,autologin,autoscale,welcome,auto-theme' }},"
          has_flag() {
            case "$FLAGS" in
              *",$1,"*) echo true ;;
              *) echo false ;;
            esac
          }
          {
            echo "INCLUDE_BROWSER=$(has_flag browser)"
            echo "INCLUDE_OFFICE=$(has_flag office)"
            echo "AUTOLOGIN=$(has_flag autologin)"
            echo "AUTOSCALE_DISPLAY=$(has_flag autoscale)"
            echo "WELCOME_WIZARD=$(has_flag welcome)"
            echo "THEME_DAEMON=$(has_flag theme-daemon)"
            echo "AUTO_THEME=$(has_flag auto-theme)"
          } >> "$GITHUB_ENV"
          if [ "$(has_flag arm64)" = "true" ]; then
            echo "ARCH=arm64" >> "$GITHUB_ENV"
          else
            echo "ARCH=amd64" >> "$GITHUB_ENV"
          fi

      - name: Set up QEMU (cross-arch build, chỉ khi ARCH=arm64)
        if: ${{ env.ARCH == 'arm64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # === 0.9) CACHE: lưu và phục hồi base debootstrap & kho gói .deb ===
      - name: Cache debootstrap base rootfs
        uses: actions/cache@v4
        with:
          path: /tmp/debootstrap-cache
          key: debootstrap-${{ env.BASE_DISTRO }}-${{ env.DEBIAN_VERSION || env.UBUNTU_VERSION || env.MINT_VERSION || 'trixie' }}-${{ env.ARCH || 'amd64' }}

      - name: Cache APT packages (.deb)
        uses: actions/cache@v4
        with:
          path: /tmp/apt-deb-cache
          key: apt-debs-${{ env.BASE_DISTRO }}-${{ env.DEBIAN_VERSION || env.UBUNTU_VERSION || env.MINT_VERSION || 'trixie' }}-${{ env.ARCH || 'amd64' }}-${{ matrix.desktop }}-${{ hashFiles('scripts/desktop.sh', 'iso-config/config/config.ini') }}
          restore-keys: |
            apt-debs-${{ env.BASE_DISTRO }}-${{ env.DEBIAN_VERSION || env.UBUNTU_VERSION || env.MINT_VERSION || 'trixie' }}-${{ env.ARCH || 'amd64' }}-${{ matrix.desktop }}-
            apt-debs-${{ env.BASE_DISTRO }}-${{ env.DEBIAN_VERSION || env.UBUNTU_VERSION || env.MINT_VERSION || 'trixie' }}-${{ env.ARCH || 'amd64' }}-
            apt-debs-${{ env.BASE_DISTRO }}-

      # === 1) BUILD: resolve distro, debootstrap, mount, apt sources ===
      - name: "[build.sh -> scripts/distros/build-${{ github.event.inputs.distro || 'debian' }}.sh] Chuẩn bị base rootfs"
        run: bash scripts/build.sh

      # === 1.1) MOUNT APT CACHE vào chroot để desktop.sh dùng lại .deb cũ ===
      - name: Mount APT cache vào chroot & cấu hình giữ package .deb
        run: |
          sudo mkdir -p /tmp/apt-deb-cache
          sudo chmod 777 /tmp/apt-deb-cache
          sudo mkdir -p "${CHROOT_DIR}/var/cache/apt/archives/partial"
          sudo chmod 777 "${CHROOT_DIR}/var/cache/apt/archives/partial"
          sudo mount --bind /tmp/apt-deb-cache "${CHROOT_DIR}/var/cache/apt/archives"
          sudo rm -f "${CHROOT_DIR}/etc/apt/apt.conf.d/docker-clean" 2>/dev/null || true
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee "${CHROOT_DIR}/etc/apt/apt.conf.d/01keep-debs" > /dev/null
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee -a "${CHROOT_DIR}/etc/apt/apt.conf.d/01keep-debs" > /dev/null

      # === 2) Copy scripts vào chroot ===
      - name: Copy scripts vào chroot
        run: |
          sudo cp scripts/desktop.sh "${CHROOT_DIR}/tmp/desktop.sh"
          sudo cp scripts/kernel-tuning.sh "${CHROOT_DIR}/tmp/kernel-tuning.sh"
          sudo cp scripts/arch.sh "${CHROOT_DIR}/tmp/arch.sh"
          sudo cp scripts/fix-cinnamon-tela-persistence.sh "${CHROOT_DIR}/tmp/fix-cinnamon-tela-persistence.sh"
          sudo cp LICENSE "${CHROOT_DIR}/tmp/LICENSE"
          sudo rm -rf "${CHROOT_DIR}/tmp/packages"
          sudo cp -r iso-config/packages "${CHROOT_DIR}/tmp/packages"
          sudo rm -rf "${CHROOT_DIR}/tmp/calamares"
          sudo cp -a iso-config/calamares "${CHROOT_DIR}/tmp/calamares"
          sudo cp iso-config/branding/Hyggshi-OS-Installer.png "${CHROOT_DIR}/tmp/Hyggshi-OS-Installer.png"
          sudo chmod 0644 "${CHROOT_DIR}/tmp/Hyggshi-OS-Installer.png"
          sudo rm -rf "${CHROOT_DIR}/tmp/hyggshi-extensions-sound-shortcut"
          sudo cp -r app-for-hyggshi/hyggshi-extensions-sound-shortcut "${CHROOT_DIR}/tmp/hyggshi-extensions-sound-shortcut"
          sudo cp app-for-hyggshi/sound-shortcut.sh "${CHROOT_DIR}/tmp/sound-shortcut.sh"
          sudo chmod +x "${CHROOT_DIR}/tmp/sound-shortcut.sh"
          sudo cp -f /tmp/hcl-resolved.json "${CHROOT_DIR}/tmp/hcl-resolved.json" 2>/dev/null || true
          sudo rm -rf "${CHROOT_DIR}/tmp/hcl-filecopy-src"
          sudo mkdir -p "${CHROOT_DIR}/tmp/hcl-filecopy-src"
          python3 -c "
          import json
          d = json.load(open('/tmp/hcl-resolved.json'))
          for fc in d.get('file_copies', []):
              src = fc.get('source')
              if src:
                  print(src)
          " | while IFS= read -r src; do
            rel="${src#./}"
            dest="${CHROOT_DIR}/tmp/hcl-filecopy-src/${rel}"
            if [ -d "$src" ]; then
              sudo mkdir -p "$dest"
              sudo cp -a "$src/." "$dest/"
            else
              sudo mkdir -p "$(dirname "$dest")"
              sudo cp "$src" "$dest"
            fi
          done
          sudo rm -rf "${CHROOT_DIR}/tmp/theme"
          sudo cp -r iso-config/theme "${CHROOT_DIR}/tmp/theme"
          sudo chmod +x "${CHROOT_DIR}/tmp/desktop.sh"

      # === 3) DESKTOP: cài package/DE/user — chạy BÊN TRONG chroot ===
      - name: "[desktop.sh] Cài desktop environment (trong chroot)"
        run: |
          set -o pipefail
          sudo mountpoint -q "${CHROOT_DIR}/dev/pts" || sudo mount --bind /dev/pts "${CHROOT_DIR}/dev/pts" || true
          sudo chroot "${CHROOT_DIR}" env \
            BASE_DISTRO="$BASE_DISTRO" \
            DE="$DE" \
            EDITION="$EDITION" \
            ARCH="$ARCH" \
            DEBUG_MODE="$DEBUG_MODE" \
            ICON_THEME="$ICON_THEME" \
            OS_USERNAME="$OS_USERNAME" \
            OS_PASSWORD="$OS_PASSWORD" \
            OS_HOSTNAME="$OS_HOSTNAME" \
            OS_TIMEZONE="$OS_TIMEZONE" \
            INCLUDE_BROWSER="$INCLUDE_BROWSER" \
            INCLUDE_OFFICE="$INCLUDE_OFFICE" \
            EXTRA_PACKAGES="${EXTRA_PACKAGES} ${HCL_PACKAGES:-}" \
            HCL_SWAP_MODE="${HCL_SWAP_MODE:-}" \
            HCL_SWAP_MB="${HCL_SWAP_MB:-0}" \
            SWAP_MODE="${SWAP_MODE:-}" \
            SWAP_MB="${SWAP_MB:-0}" \
            AUTOLOGIN="$AUTOLOGIN" \
            AUTOSCALE_DISPLAY="$AUTOSCALE_DISPLAY" \
            FLATHUB_APPS="${HCL_FLATHUB_APPS:-}" \
            /tmp/desktop.sh 2>&1 | tee install-debug.log

      # === 3.1) CINNAMON: sửa Dark/Light + Cinnamon Spices ===
      - name: "[cinnamon-fix] Fix Dark/Light mode + Cinnamon Spices downloader"
        if: ${{ env.DE == 'cinnamon' }}
        run: |
          set -euo pipefail
          sudo chroot "${CHROOT_DIR}" /bin/bash -s <<'CHROOT_SCRIPT'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            cinnamon cinnamon-common gnome-themes-extra \
            gsettings-desktop-schemas xdg-desktop-portal xdg-desktop-portal-xapp
          apt-get install -y --only-upgrade cinnamon cinnamon-common || true
          SPICES="/usr/share/cinnamon/cinnamon-settings/bin/Spices.py"
          if [ -f "$SPICES" ]; then
            cp -a "$SPICES" "${SPICES}.hyggshi-backup"
            python3 - "$SPICES" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          original = source
          source = source.replace(
              "assert response.ok",
              "response.raise_for_status()",
              1,
          )
          source = source.replace(
              "totalSize = int(response.headers.get('content-length'))",
              "content_length = response.headers.get('content-length')\n"
              "            totalSize = int(content_length) if content_length else -1",
              1,
          )
          if "def _set_progressbar_pulse(self):" not in source:
              marker = "    def _set_progressbar_visible(self, visible):"
              method = (
                  "    def _set_progressbar_pulse(self):\n"
                  "        for progressbar in self.progressbars:\n"
                  "            progressbar.pulse()\n"
                  "\n"
              )
              if marker in source:
                  source = source.replace(marker, method + marker, 1)
          old_progress = (
              "        if current and total:\n"
              "            fraction = float(current) / float(total)\n"
              "            text = _(\"Downloading images:\") + f\" {current}/{total}\"\n"
              "            self._set_progressbar_text(text)\n"
              "        else:\n"
              "            fraction = count * blockSize / float((totalSize / blockSize + 1) * blockSize)\n"
              "\n"
              "        self._set_progressbar_fraction(fraction)"
          )
          new_progress = (
              "        if current and total:\n"
              "            fraction = float(current) / float(total)\n"
              "            text = _(\"Downloading images:\") + f\" {current}/{total}\"\n"
              "            self._set_progressbar_text(text)\n"
              "            self._set_progressbar_fraction(fraction)\n"
              "        elif totalSize == -1:\n"
              "            self._set_progressbar_pulse()\n"
              "        else:\n"
              "            fraction = count * blockSize / float((totalSize / blockSize + 1) * blockSize)\n"
              "            self._set_progressbar_fraction(fraction)"
          )
          if old_progress in source:
              source = source.replace(old_progress, new_progress, 1)
          if source != original:
              path.write_text(source, encoding="utf-8")
              print("Hyggshi OS: Cinnamon Spices.py patched successfully")
          else:
              print("Hyggshi OS: Cinnamon Spices.py đã có bản sửa, bỏ qua patch")
          PY
          fi
          mkdir -p /etc/dconf/db/local.d
          cat > /etc/dconf/db/local.d/00-hyggshi-cinnamon-color-scheme <<'EOF'
          [org/gnome/desktop/interface]
          color-scheme='default'
          [org/x/apps/portal]
          color-scheme='default'
          EOF
          dconf update || true
          mkdir -p /etc/skel/.local/share/themes
          mkdir -p /etc/skel/.themes
          mkdir -p /etc/skel/.local/share/cinnamon/themes
          CHROOT_SCRIPT

      # === 3.5) NEXWM: build từ source (tuỳ chọn) ===
      - name: "[build-nexwm.sh] Build & cài NexWM từ source (trong chroot)"
        if: ${{ env.BUILD_NEXWM == 'true' }}
        run: |
          set -o pipefail
          sudo cp scripts/build-nexwm.sh "${CHROOT_DIR}/tmp/build-nexwm.sh"
          sudo chmod +x "${CHROOT_DIR}/tmp/build-nexwm.sh"
          sudo chroot "${CHROOT_DIR}" env \
            DEBUG_MODE="$DEBUG_MODE" \
            /tmp/build-nexwm.sh 2>&1 | tee nexwm-build-debug.log

      # === 4) ECOSYSTEM: cài .deb, cấu hình nexfetch ===
      - name: "[install-ecosystem-for-hyggshi.sh] Cài hệ sinh thái ứng dụng Hyggshi (nexfetch...)"
        run: |
          set -o pipefail
          sudo mkdir -p "${CHROOT_DIR}/tmp/app-for-hyggshi"
          sudo cp -r app-for-hyggshi/. "${CHROOT_DIR}/tmp/app-for-hyggshi/"
          sudo cp scripts/install-ecosystem-for-hyggshi.sh "${CHROOT_DIR}/tmp/install-ecosystem-for-hyggshi.sh"
          sudo chmod +x "${CHROOT_DIR}/tmp/install-ecosystem-for-hyggshi.sh"
          IW_ENV_FILE="${CHROOT_DIR}/tmp/chroot-iw-env.sh"
          sudo bash -c "echo '#!/bin/sh' > '$IW_ENV_FILE'"
          IW_COUNT="${HCL_INSTALL_WEB_COUNT:-${INSTALL_WEB_COUNT:-0}}"
          sudo bash -c "echo 'export INSTALL_WEB_COUNT=\"${IW_COUNT:-0}\"' >> '$IW_ENV_FILE'"
          sudo bash -c "echo 'export HCL_INSTALL_WEB_COUNT=\"${IW_COUNT:-0}\"' >> '$IW_ENV_FILE'"
          sudo bash -c "echo 'export GITHUB_ACTIONS=\"true\"' >> '$IW_ENV_FILE'"
          if [ "$IW_COUNT" -gt 0 ] 2>/dev/null; then
            for iw_idx in $(seq 1 "$IW_COUNT"); do
              iw_k_hcl="HCL_INSTALL_WEB_${iw_idx}_KEY"
              iw_k_plain="INSTALL_WEB_${iw_idx}_KEY"
              iw_key_val="${!iw_k_hcl:-${!iw_k_plain:-}}"
              sudo bash -c "printf 'export INSTALL_WEB_%s_KEY=%q\n' '$iw_idx' '$iw_key_val' >> '$IW_ENV_FILE'"
              sudo bash -c "printf 'export HCL_INSTALL_WEB_%s_KEY=%q\n' '$iw_idx' '$iw_key_val' >> '$IW_ENV_FILE'"
              iw_rc_hcl="HCL_INSTALL_WEB_${iw_idx}_RUN_COUNT"
              iw_rc_plain="INSTALL_WEB_${iw_idx}_RUN_COUNT"
              iw_run_count="${!iw_rc_hcl:-${!iw_rc_plain:-0}}"
              sudo bash -c "printf 'export INSTALL_WEB_%s_RUN_COUNT=%q\n' '$iw_idx' '$iw_run_count' >> '$IW_ENV_FILE'"
              sudo bash -c "printf 'export HCL_INSTALL_WEB_%s_RUN_COUNT=%q\n' '$iw_idx' '$iw_run_count' >> '$IW_ENV_FILE'"
              if [ "$iw_run_count" -gt 0 ] 2>/dev/null; then
                for iw_j in $(seq 1 "$iw_run_count"); do
                  iw_r_hcl="HCL_INSTALL_WEB_${iw_idx}_RUN_${iw_j}"
                  iw_r_plain="INSTALL_WEB_${iw_idx}_RUN_${iw_j}"
                  iw_run_val="${!iw_r_hcl:-${!iw_r_plain:-}}"
                  sudo bash -c "printf 'export INSTALL_WEB_%s_RUN_%s=%q\n' '$iw_idx' '$iw_j' '$iw_run_val' >> '$IW_ENV_FILE'"
                  sudo bash -c "printf 'export HCL_INSTALL_WEB_%s_RUN_%s=%q\n' '$iw_idx' '$iw_j' '$iw_run_val' >> '$IW_ENV_FILE'"
                done
              fi
            done
          fi
          sudo chmod +x "$IW_ENV_FILE"
          sudo chroot "${CHROOT_DIR}" /bin/bash -c "
            . /tmp/chroot-iw-env.sh
            export GITHUB_ACTIONS='true'
            export CI='true'
            export DEBUG_MODE='$DEBUG_MODE'
            export APP_DIR='/tmp/app-for-hyggshi'
            export HCL_APP_INSTALLS='${HCL_APP_INSTALLS:-}'
            exec /tmp/install-ecosystem-for-hyggshi.sh
          " 2>&1 | tee ecosystem-debug.log

      # === 4.4) FIX CACHE: gỡ bind-mount + trả lại quyền sở hữu runner cho
      # /tmp/apt-deb-cache TRƯỚC KHI actions/cache post-step chạy tar lưu
      # cache ở CUỐI job. Đây là nguyên nhân của lỗi:
      #   "Failed to save: /usr/bin/tar failed with error: exit code 2"
      # Lý do: mọi .deb trong /tmp/apt-deb-cache được TẢI BÊN TRONG chroot
      # bằng `sudo chroot` (root), qua bind-mount vào
      # ${CHROOT_DIR}/var/cache/apt/archives (xem step "Mount APT cache vào
      # chroot" ở trên) — nên file thuộc sở hữu root, có thể có mode/owner
      # khác thường. actions/cache@v4 lại chạy post-step bằng user runner
      # THƯỜNG (không phải root) để `tar` nén lại — gặp file không đọc được
      # / bind-mount còn sống -> tar exit code 2 -> "Failed to save".
      # if: always() để dù step nào phía trên fail, cache vẫn được gỡ mount
      # và fix quyền, tránh lỗi lặp lại ở lần chạy build tiếp theo.
      - name: Gỡ bind-mount & fix quyền APT cache trước khi actions/cache lưu lại
        if: always()
        run: |
          sudo umount "${CHROOT_DIR}/var/cache/apt/archives" 2>/dev/null || true
          if [ -d /tmp/apt-deb-cache ]; then
            sudo chown -R "$(id -u):$(id -g)" /tmp/apt-deb-cache
            sudo find /tmp/apt-deb-cache -type f -exec chmod 644 {} + 2>/dev/null || true
            sudo find /tmp/apt-deb-cache -type d -exec chmod 755 {} + 2>/dev/null || true
            # Dọn file đặc biệt (symlink gãy, socket, device node...) mà
            # dpkg/apt đôi khi để sót trong archives/ — tar không nén được
            # các loại này và cũng gây exit code 2.
            sudo find /tmp/apt-deb-cache -xtype l -delete 2>/dev/null || true
          fi
          if [ -d /tmp/debootstrap-cache ]; then
            sudo chown -R "$(id -u):$(id -g)" /tmp/debootstrap-cache
          fi

      # === 4.5) WELCOME: build trực tiếp source đã commit ===
      - name: "[welcome.sh] Build & cài Hyggshi Welcome từ source đã commit (trong chroot)"
        if: ${{ env.WELCOME_WIZARD == 'true' }}
        run: |
          set -o pipefail
          sudo mkdir -p "${CHROOT_DIR}/tmp/hyggshi-welcome-src"
          sudo cp -r app-for-hyggshi/hyggshi-welcome/. "${CHROOT_DIR}/tmp/hyggshi-welcome-src/"
          sudo cp app-for-hyggshi/welcome.sh "${CHROOT_DIR}/tmp/welcome.sh"
          sudo chmod +x "${CHROOT_DIR}/tmp/welcome.sh"
          sudo chroot "${CHROOT_DIR}" env \
            DEBUG_MODE="$DEBUG_MODE" \
            SRC_DIR="/tmp/hyggshi-welcome-src" \
            /tmp/welcome.sh 2>&1 | tee welcome-debug.log

      # === 4.6) THEME DAEMON ===
      - name: "[make-theme-daemon.sh] Sinh source code Hyggshi Theme Daemon (C++/xfconf)"
        if: ${{ env.THEME_DAEMON == 'true' }}
        run: bash scripts/make-theme-daemon.sh

      - name: "[theme-daemon.sh] Build & cài Hyggshi Theme Daemon (trong chroot)"
        if: ${{ env.THEME_DAEMON == 'true' }}
        run: |
          set -o pipefail
          sudo mkdir -p "${CHROOT_DIR}/tmp/hyggshi-theme-daemon-src"
          sudo cp -r app-for-hyggshi/hyggshi-theme-daemon/. "${CHROOT_DIR}/tmp/hyggshi-theme-daemon-src/"
          sudo cp app-for-hyggshi/theme-daemon.sh "${CHROOT_DIR}/tmp/theme-daemon.sh"
          sudo chmod +x "${CHROOT_DIR}/tmp/theme-daemon.sh"
          sudo chroot "${CHROOT_DIR}" env \
            DEBUG_MODE="$DEBUG_MODE" \
            SRC_DIR="/tmp/hyggshi-theme-daemon-src" \
            /tmp/theme-daemon.sh 2>&1 | tee theme-daemon-debug.log

      # === 4.7) AUTO THEME ===
      - name: "[make-auto-theme.sh] Sinh source code Hyggshi Auto Theme (bash)"
        if: ${{ env.AUTO_THEME == 'true' }}
        run: bash scripts/make-auto-theme.sh

      - name: "[auto-theme.sh] Cài Hyggshi Auto Theme (trong chroot, không cần build)"
        if: ${{ env.AUTO_THEME == 'true' }}
        run: |
          set -o pipefail
          sudo mkdir -p "${CHROOT_DIR}/tmp/hyggshi-theme-src"
          sudo cp -r app-for-hyggshi/hyggshi-theme/. "${CHROOT_DIR}/tmp/hyggshi-theme-src/"
          sudo cp app-for-hyggshi/auto-theme.sh "${CHROOT_DIR}/tmp/auto-theme.sh"
          sudo chmod +x "${CHROOT_DIR}/tmp/auto-theme.sh"
          sudo chroot "${CHROOT_DIR}" env \
            DEBUG_MODE="$DEBUG_MODE" \
            SRC_DIR="/tmp/hyggshi-theme-src" \
            /tmp/auto-theme.sh 2>&1 | tee auto-theme-debug.log

      # === 5) BRANDING: wallpaper, logo, os-release, panel, autostart ===
      - name: "[branding.sh] Wallpaper / logo / rebrand / panel"
        run: |
          set -o pipefail
          bash scripts/branding.sh 2>&1 | tee branding-debug.log

      # === 6) PLYMOUTH: boot splash theme & initramfs ===
      - name: "[plymouth.sh] Plymouth boot splash & initramfs"
        run: |
          set -o pipefail
          bash scripts/plymouth.sh 2>&1 | tee plymouth-debug.log

      - name: Collect debug info (chỉ khi debug_mode = true)
        if: ${{ env.DEBUG_MODE == 'true' }}
        run: |
          CHROOT="${CHROOT_DIR}"
          {
            echo "===== Inputs / env ====="
            echo "DISTRO_NAME=$DISTRO_NAME | EDITION=$EDITION"
            echo "BASE_DISTRO=$BASE_DISTRO | BASE_CODENAME=$BASE_CODENAME | DISTRO_LABEL=$DISTRO_LABEL"
            echo "HYGGSHI_CODENAME=$HYGGSHI_CODENAME (trống nếu build tự chọn — xem branding-debug.log để biết giá trị thật đã dùng)"
            echo "DE=$DE | PANEL_STYLE=$PANEL_STYLE | ICON_THEME=$ICON_THEME"
            echo "OS_USERNAME=$OS_USERNAME | OS_HOSTNAME=$OS_HOSTNAME | OS_TIMEZONE=$OS_TIMEZONE"
            echo
            echo "===== Disk usage (runner) ====="
            df -h
            echo
            echo "===== iso-config/branding contents ====="
            find iso-config/branding -type f -exec ls -la {} \; 2>/dev/null || echo "(không có thư mục iso-config/branding)"
            echo
            echo "===== /etc/apt/sources.list trong chroot ====="
            sudo cat "$CHROOT/etc/apt/sources.list" 2>/dev/null || true
            echo
            echo "===== /etc/os-release trong chroot ====="
            sudo cat "$CHROOT/etc/os-release" 2>/dev/null || true
            echo
            echo "===== /etc/lsb-release trong chroot ====="
            sudo cat "$CHROOT/etc/lsb-release" 2>/dev/null || true
            echo
            echo "===== backgrounds/hyggshi trong chroot ====="
            sudo ls -la "$CHROOT/usr/share/backgrounds/hyggshi/" 2>/dev/null || true
            echo
            echo "===== distributor-logo đã ghi vào hicolor (128x128) ====="
            sudo ls -la "$CHROOT/usr/share/icons/hicolor/128x128/apps/" 2>/dev/null | grep distributor || true
            echo
            echo "===== /etc/xdg/autostart (system-wide) ====="
            sudo ls -la "$CHROOT/etc/xdg/autostart/" 2>/dev/null || true
            echo
            echo "===== hyggshi-welcome (binary + desktop entry) ====="
            sudo ls -la "$CHROOT/usr/bin/hyggshi-welcome" 2>/dev/null || echo "(chưa cài — WELCOME_WIZARD=false hoặc build lỗi)"
            sudo cat "$CHROOT/usr/share/applications/hyggshi-welcome.desktop" 2>/dev/null || true
            echo
            echo "===== hyggshi-theme-daemon (binary + systemd preset) ====="
            sudo ls -la "$CHROOT/usr/bin/hyggshi-theme-daemon" 2>/dev/null || echo "(chưa cài — THEME_DAEMON=false hoặc build lỗi)"
            sudo cat "$CHROOT/usr/lib/systemd/user-preset/90-hyggshi-theme-daemon.preset" 2>/dev/null || true
            echo "===== hyggshi-auto-theme (bash script + systemd timer) ====="
            sudo ls -la "$CHROOT/usr/local/bin/hyggshi-auto-theme" 2>/dev/null || echo "(chưa cài — AUTO_THEME=false hoặc cài lỗi)"
            sudo ls -la "$CHROOT/etc/systemd/system/timers.target.wants/hyggshi-auto-theme.timer" 2>/dev/null || true
            sudo cat "$CHROOT/etc/hyggshi/theme.conf" 2>/dev/null || true
            echo
            echo "===== update-alternatives desktop-background ====="
            sudo chroot "$CHROOT" update-alternatives --display desktop-background 2>&1 || true
            echo
            echo "===== Mọi file xfce4-desktop.xml tìm thấy trong hệ thống ====="
            sudo find "$CHROOT/etc/xdg" "$CHROOT/usr/share" "$CHROOT/home" \
              -name "xfce4-desktop.xml" 2>/dev/null | while read -r f; do
              echo "--- $f ---"
              sudo cat "$f" 2>/dev/null
            done || true
          } > debug-info.txt
          echo "----- debug-info.txt preview -----"
          cat debug-info.txt

      - name: Upload debug artifact (log build + debug-info.txt)
        if: ${{ env.DEBUG_MODE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-debug-${{ matrix.desktop }}
          path: |
            install-debug.log
            nexwm-build-debug.log
            ecosystem-debug.log
            welcome-debug.log
            branding-debug.log
            plymouth-debug.log
            debug-info.txt
          retention-days: 14
          if-no-files-found: ignore

      # === 7) ISO: unmount, squashfs, grub, đóng gói ISO ===
      # LƯU Ý: nội dung gốc từ đây trở đi bị CẮT trong file bạn upload —
      # phần "[iso.sh] Build squashfs + ISO bootable" trở xuống KHÔNG có
      # trong bản gốc mình nhận được, nên mình không tái tạo lại được.
      # Hãy dán tiếp phần còn lại (từ "[iso.sh]" tới hết file) nếu muốn
      # mình kiểm tra/chỉnh sửa luôn phần đó.
      - name: "[iso.sh] Build squashfs + ISO bootable"
        run: |
          HCL_SQUASHFS_MAX_COMPRESSION="${HCL_SQUASHFS_MAX_COMPRESSION:-}" \
          SQUASHFS_MAX_COMPRESSION="${SQUASHFS_MAX_COMPRESSION:-}" \
          # ... phần còn lại của step này và các step sau bị cắt trong bản gốc ...
