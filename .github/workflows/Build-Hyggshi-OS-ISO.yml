name: Build Hyggshi OS ISO

on:
  workflow_dispatch:
    inputs:
      distro:
        description: "Bản phân phối gốc (base distro)"
        required: false
        type: choice
        options: [debian, ubuntu, linuxmint, alpine]
        default: "debian"
      debian_version:
        description: "Phiên bản Debian (chỉ áp dụng khi distro = debian)"
        required: false
        type: choice
        options: [trixie, bookworm, bullseye]
        default: "trixie"
      ubuntu_version:
        description: "Phiên bản Ubuntu (chỉ áp dụng khi distro = ubuntu)"
        required: false
        type: choice
        options: [noble, mantic, jammy, focal]
        default: "noble"
      mint_version:
        description: "Phiên bản Linux Mint (chỉ áp dụng khi distro = linuxmint)"
        required: false
        type: choice
        options: ["22", "21.3", "21.2"]
        default: "22"
      alpine_version:
        description: "Phiên bản Alpine (chỉ áp dụng khi distro = alpine — EXPERIMENTAL, mới bootstrap base rootfs, chưa có desktop/branding/iso riêng cho Alpine)"
        required: false
        type: choice
        options: ["v3.20", "v3.19", "edge"]
        default: "v3.20"
      desktop:
        description: "Desktop environment"
        required: false
        type: choice
        options: [xfce, kde, lxqt]
        default: "xfce"
      panel_style:
        description: "Kiểu taskbar (chỉ áp dụng cho XFCE)"
        required: false
        type: choice
        options: [windows10, classic]
        default: "windows10"
      icon_theme:
        description: "Bộ icon (chỉ áp dụng cho XFCE)"
        required: false
        type: choice
        options: [papirus, numix, breeze, adwaita]
        default: "papirus"
      username:
        description: "Username mặc định trong live session"
        required: false
        default: "hyggshi"
      user_password:
        description: "Mật khẩu user (plaintext, chỉ dùng cho ISO test)"
        required: false
        default: "hyggshi"
      hostname:
        description: "Hostname máy"
        required: false
        default: "hyggshi-os"
      timezone:
        description: "Múi giờ (vd Asia/Ho_Chi_Minh, UTC)"
        required: false
        default: "Asia/Ho_Chi_Minh"
      include_browser:
        description: "Cài sẵn Firefox ESR?"
        type: boolean
        default: true
      include_office:
        description: "Cài sẵn LibreOffice?"
        type: boolean
        default: false
      extra_packages:
        description: "Gói apt thêm, cách nhau bằng dấu cách (vd: vlc gimp htop)"
        required: false
        default: ""
      release_iso:
        description: "Attach ISO to a GitHub Release?"
        type: boolean
        default: false
      debug_mode:
        description: "Bật debug (log chi tiết + xuất debug-info.txt kèm ISO)"
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - "build-hyggshi-os.yml"
      - "scripts/**"
      - "iso-config/**"

env:
  DISTRO_NAME: "Hyggshi OS"
  BASE_DISTRO: ${{ github.event.inputs.distro || 'debian' }}
  # LƯU Ý: debian_version/ubuntu_version/mint_version/alpine_version KHÔNG đặt
  # ở đây. Nếu đặt cứng ở env cấp workflow, GitHub Actions in TOÀN BỘ 4 biến
  # ra log của MỌI step (kể cả 3 biến không liên quan tới distro đã chọn —
  # ví dụ chọn debian vẫn thấy UBUNTU_VERSION/MINT_VERSION/ALPINE_VERSION),
  # gây hiểu lầm là chúng có tác dụng. Thay vào đó, step "Resolve version
  # theo distro đã chọn" bên dưới chỉ export ĐÚNG 1 biến khớp với
  # $BASE_DISTRO vào $GITHUB_ENV — 3 biến còn lại không hề được set.
  ISO_FILENAME: "hyggshi-os-${{ github.run_number }}.iso"
  DE: ${{ github.event.inputs.desktop || 'xfce' }}
  PANEL_STYLE: ${{ github.event.inputs.panel_style || 'windows10' }}
  ICON_THEME: ${{ github.event.inputs.icon_theme || 'papirus' }}
  OS_USERNAME: ${{ github.event.inputs.username || 'hyggshi' }}
  OS_PASSWORD: ${{ github.event.inputs.user_password || 'hyggshi' }}
  OS_HOSTNAME: ${{ github.event.inputs.hostname || 'hyggshi-os' }}
  OS_TIMEZONE: ${{ github.event.inputs.timezone || 'Asia/Ho_Chi_Minh' }}
  INCLUDE_BROWSER: ${{ github.event.inputs.include_browser || 'true' }}
  INCLUDE_OFFICE: ${{ github.event.inputs.include_office || 'false' }}
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || '' }}
  DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
  WALLPAPER_URL: "https://raw.githubusercontent.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/main/iso-config/branding/Wallpaper.png"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    # debootstrap + chroot cần quyền root
    steps:
      - name: Checkout repo (scripts, config files, branding...)
        uses: actions/checkout@v4

      - name: Chmod +x cho toàn bộ scripts/
        run: chmod +x scripts/*.sh

      # Chỉ export ĐÚNG 1 biến version khớp với $BASE_DISTRO. Các biến của
      # 3 distro còn lại (không được chọn) không hề tồn tại trong môi trường
      # của các step sau — không còn cảnh debian mà vẫn thấy UBUNTU_VERSION.
      - name: Resolve version theo distro đã chọn
        run: |
          case "$BASE_DISTRO" in
            debian)
              echo "DEBIAN_VERSION=${{ github.event.inputs.debian_version || 'trixie' }}" >> "$GITHUB_ENV" ;;
            ubuntu)
              echo "UBUNTU_VERSION=${{ github.event.inputs.ubuntu_version || 'noble' }}" >> "$GITHUB_ENV" ;;
            linuxmint)
              echo "MINT_VERSION=${{ github.event.inputs.mint_version || '22' }}" >> "$GITHUB_ENV" ;;
            alpine)
              echo "ALPINE_VERSION=${{ github.event.inputs.alpine_version || 'v3.20' }}" >> "$GITHUB_ENV" ;;
            *)
              echo "Distro không hợp lệ: $BASE_DISTRO"
              exit 1 ;;
          esac

      # === 1) BUILD: resolve distro, debootstrap, mount, apt sources ===
      - name: "[build.sh] Chuẩn bị base rootfs"
        run: bash scripts/build.sh

      # === 2) DESKTOP: cài package/DE/user — chạy BÊN TRONG chroot ===
      # BỎ QUA khi distro=alpine: rootfs Alpine dùng apk/musl, không có
      # /bin/bash (chỉ có busybox ash) nên `chroot ... env ... /tmp/desktop.sh`
      # (shebang #!/bin/bash) sẽ chết với lỗi khó hiểu "can't execute
      # '/tmp/desktop.sh': No such file or directory" (thực ra là thiếu
      # interpreter, không phải thiếu file) — vì desktop.sh/branding.sh/iso.sh
      # hiện tại được viết cho apt-based distro. Xem ghi chú trong
      # scripts/distros/build-alpine.sh.
      - name: "[desktop.sh] Cài desktop environment (trong chroot)"
        if: ${{ env.BASE_DISTRO != 'alpine' }}
        run: |
          sudo cp scripts/desktop.sh live-build/chroot/tmp/desktop.sh
          sudo chmod +x live-build/chroot/tmp/desktop.sh
          sudo chroot live-build/chroot env \
            BASE_DISTRO="$BASE_DISTRO" \
            DE="$DE" \
            DEBUG_MODE="$DEBUG_MODE" \
            ICON_THEME="$ICON_THEME" \
            OS_USERNAME="$OS_USERNAME" \
            OS_PASSWORD="$OS_PASSWORD" \
            OS_HOSTNAME="$OS_HOSTNAME" \
            OS_TIMEZONE="$OS_TIMEZONE" \
            INCLUDE_BROWSER="$INCLUDE_BROWSER" \
            INCLUDE_OFFICE="$INCLUDE_OFFICE" \
            EXTRA_PACKAGES="$EXTRA_PACKAGES" \
            /tmp/desktop.sh 2>&1 | tee install-debug.log

      # === 3) BRANDING: wallpaper, logo, os-release, panel, autostart ===
      # Bỏ qua cho alpine cùng lý do như bước desktop.sh ở trên.
      - name: "[branding.sh] Wallpaper / logo / rebrand / panel"
        if: ${{ env.BASE_DISTRO != 'alpine' }}
        run: bash scripts/branding.sh 2>&1 | tee branding-debug.log

      - name: Collect debug info (chỉ khi debug_mode = true)
        if: ${{ env.DEBUG_MODE == 'true' && env.BASE_DISTRO != 'alpine' }}
        run: |
          CHROOT=live-build/chroot
          {
            echo "===== Inputs / env ====="
            echo "BASE_DISTRO=$BASE_DISTRO | BASE_CODENAME=$BASE_CODENAME | DISTRO_LABEL=$DISTRO_LABEL"
            echo "DE=$DE | PANEL_STYLE=$PANEL_STYLE | ICON_THEME=$ICON_THEME"
            echo "OS_USERNAME=$OS_USERNAME | OS_HOSTNAME=$OS_HOSTNAME | OS_TIMEZONE=$OS_TIMEZONE"
            echo

            echo "===== Disk usage (runner) ====="
            df -h
            echo

            echo "===== iso-config/branding contents ====="
            find iso-config/branding -type f -exec ls -la {} \; 2>/dev/null || echo "(không có thư mục iso-config/branding)"
            echo

            echo "===== /etc/apt/sources.list trong chroot ====="
            sudo cat "$CHROOT/etc/apt/sources.list" 2>/dev/null || true
            echo

            echo "===== /etc/os-release trong chroot ====="
            sudo cat "$CHROOT/etc/os-release" 2>/dev/null || true
            echo

            echo "===== /etc/lsb-release trong chroot ====="
            sudo cat "$CHROOT/etc/lsb-release" 2>/dev/null || true
            echo

            echo "===== backgrounds/hyggshi trong chroot ====="
            sudo ls -la "$CHROOT/usr/share/backgrounds/hyggshi/" 2>/dev/null || true
            echo

            echo "===== distributor-logo đã ghi vào hicolor (128x128) ====="
            sudo ls -la "$CHROOT/usr/share/icons/hicolor/128x128/apps/" 2>/dev/null | grep distributor || true
            echo

            echo "===== /etc/xdg/autostart (system-wide) ====="
            sudo ls -la "$CHROOT/etc/xdg/autostart/" 2>/dev/null || true
            echo

            echo "===== update-alternatives desktop-background ====="
            sudo chroot "$CHROOT" update-alternatives --display desktop-background 2>&1 || true
            echo

            # LƯU Ý: sudo find có thể liệt kê được cả file bên trong
            # $CHROOT/home/<user> (thường mode 700), nhưng `cat` KHÔNG sudo
            # sẽ bị "Permission denied" khi đọc file trong đó -> exit code
            # khác 0 -> vì đây là lệnh CUỐI trong pipe (while), dưới `set -e`
            # (shell mặc định của GitHub Actions) toàn bộ step sẽ bị abort
            # NGAY LẬP TỨC và không in được dòng nào ra debug-info.txt.
            # Fix: thêm `sudo` vào cat, và `|| true` chặn an toàn cho cả pipeline.
            echo "===== Mọi file xfce4-desktop.xml tìm thấy trong hệ thống ====="
            sudo find "$CHROOT/etc/xdg" "$CHROOT/usr/share" "$CHROOT/home" \
              -name "xfce4-desktop.xml" 2>/dev/null | while read -r f; do
              echo "--- $f ---"
              sudo cat "$f" 2>/dev/null
            done || true
          } > debug-info.txt

          echo "----- debug-info.txt preview -----"
          cat debug-info.txt

      - name: Upload debug artifact (log build + debug-info.txt)
        if: ${{ env.DEBUG_MODE == 'true' && env.BASE_DISTRO != 'alpine' }}
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-debug
          path: |
            install-debug.log
            branding-debug.log
            debug-info.txt
          retention-days: 14
          if-no-files-found: ignore

      # === 4) ISO: unmount, squashfs, grub, đóng gói ISO ===
      # Bỏ qua cho alpine: chưa có desktop/kernel nên không có gì để đóng ISO.
      - name: "[iso.sh] Build squashfs + ISO bootable"
        if: ${{ env.BASE_DISTRO != 'alpine' }}
        run: bash scripts/iso.sh

      - name: Upload ISO as build artifact
        if: ${{ env.BASE_DISTRO != 'alpine' }}
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-iso
          path: ${{ env.ISO_FILENAME }}
          retention-days: 14

      - name: Attach ISO to GitHub Release (optional)
        if: ${{ github.event.inputs.release_iso == 'true' && env.BASE_DISTRO != 'alpine' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ISO_FILENAME }}
          tag_name: "hyggshi-os-${{ github.run_number }}"
          name: "Hyggshi OS build #${{ github.run_number }}"

      # === 4-alpine) Alpine hiện chỉ dừng ở base rootfs (xem
      # scripts/distros/build-alpine.sh) — đóng gói rootfs thành tarball
      # thay vì cố build ISO, để job kết thúc THÀNH CÔNG và có artifact xem
      # được, thay vì chạy tiếp vào desktop.sh/iso.sh rồi vỡ giữa chừng.
      - name: "[alpine] Đóng gói base rootfs (chưa có desktop/ISO)"
        if: ${{ env.BASE_DISTRO == 'alpine' }}
        run: |
          echo "Alpine base rootfs build xong — chưa có desktop/branding/ISO cho Alpine."
          echo "Đóng gói live-build/chroot thành tarball để kiểm tra."
          sudo tar -C live-build/chroot -cJf hyggshi-os-alpine-rootfs.tar.xz .
          ls -lh hyggshi-os-alpine-rootfs.tar.xz

      - name: Upload Alpine rootfs artifact
        if: ${{ env.BASE_DISTRO == 'alpine' }}
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-alpine-rootfs
          path: hyggshi-os-alpine-rootfs.tar.xz
          retention-days: 14
