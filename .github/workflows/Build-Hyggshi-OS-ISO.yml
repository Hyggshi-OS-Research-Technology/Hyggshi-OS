name: Build Hyggshi OS ISO

on:
  workflow_dispatch:
    inputs:
      distro:
        description: "Bản phân phối gốc (base distro)"
        required: false
        type: choice
        options: [debian, ubuntu, linuxmint]
        default: "debian"
      debian_version:
        description: "Phiên bản Debian (chỉ áp dụng khi distro = debian)"
        required: false
        type: choice
        options: [trixie, bookworm, bullseye]
        default: "trixie"
      ubuntu_version:
        description: "Phiên bản Ubuntu (chỉ áp dụng khi distro = ubuntu)"
        required: false
        type: choice
        options: [noble, mantic, jammy, focal]
        default: "noble"
      mint_version:
        description: "Phiên bản Linux Mint (chỉ áp dụng khi distro = linuxmint)"
        required: false
        type: choice
        options: ["22", "21.3", "21.2"]
        default: "22"
      desktop:
        description: "Desktop environment"
        required: false
        type: choice
        options: [xfce, kde]
        default: "xfce"
      panel_style:
        description: "Kiểu taskbar (chỉ áp dụng cho XFCE)"
        required: false
        type: choice
        options: [windows10, classic]
        default: "windows10"
      icon_theme:
        description: "Bộ icon (chỉ áp dụng cho XFCE)"
        required: false
        type: choice
        options: [papirus, numix, breeze, adwaita]
        default: "papirus"
      username:
        description: "Username mặc định trong live session"
        required: false
        default: "hyggshi"
      user_password:
        description: "Mật khẩu user (plaintext, chỉ dùng cho ISO test)"
        required: false
        default: "hyggshi"
      hostname:
        description: "Hostname máy"
        required: false
        default: "hyggshi-os"
      timezone:
        description: "Múi giờ (vd Asia/Ho_Chi_Minh, UTC)"
        required: false
        default: "Asia/Ho_Chi_Minh"
      include_browser:
        description: "Cài sẵn Firefox ESR?"
        type: boolean
        default: true
      include_office:
        description: "Cài sẵn LibreOffice?"
        type: boolean
        default: false
      extra_packages:
        description: "Gói apt thêm, cách nhau bằng dấu cách (vd: vlc gimp htop)"
        required: false
        default: ""
      release_iso:
        description: "Attach ISO to a GitHub Release?"
        type: boolean
        default: false
      debug_mode:
        description: "Bật debug (log chi tiết + xuất debug-info.txt kèm ISO)"
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - "build-hyggshi-os.yml"
      - "iso-config/**"

env:
  DISTRO_NAME: "Hyggshi OS"
  BASE_DISTRO: ${{ github.event.inputs.distro || 'debian' }}
  DEBIAN_VERSION: ${{ github.event.inputs.debian_version || 'trixie' }}
  UBUNTU_VERSION: ${{ github.event.inputs.ubuntu_version || 'noble' }}
  MINT_VERSION: ${{ github.event.inputs.mint_version || '22' }}
  ISO_FILENAME: "hyggshi-os-${{ github.run_number }}.iso"
  DE: ${{ github.event.inputs.desktop || 'xfce' }}
  PANEL_STYLE: ${{ github.event.inputs.panel_style || 'windows10' }}
  ICON_THEME: ${{ github.event.inputs.icon_theme || 'papirus' }}
  OS_USERNAME: ${{ github.event.inputs.username || 'hyggshi' }}
  OS_PASSWORD: ${{ github.event.inputs.user_password || 'hyggshi' }}
  OS_HOSTNAME: ${{ github.event.inputs.hostname || 'hyggshi-os' }}
  OS_TIMEZONE: ${{ github.event.inputs.timezone || 'Asia/Ho_Chi_Minh' }}
  INCLUDE_BROWSER: ${{ github.event.inputs.include_browser || 'true' }}
  INCLUDE_OFFICE: ${{ github.event.inputs.include_office || 'false' }}
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || '' }}
  DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
  WALLPAPER_URL: "https://raw.githubusercontent.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/main/iso-config/branding/Wallpaper.png"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    # debootstrap + chroot cần quyền root, và cần binfmt tắt an toàn cho amd64-on-amd64
    steps:
      - name: Checkout repo (config files, Plymouth theme, branding...)
        uses: actions/checkout@v4

      - name: Free up disk space (runner mặc định ~14GB free, ISO build cần nhiều hơn)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap squashfs-tools xorriso isolinux syslinux-efi \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools \
            live-boot live-boot-doc

      - name: Resolve base distro (codename, mirror, apt template)
        id: resolve_distro
        run: |
          set -e
          case "${{ env.BASE_DISTRO }}" in
            debian)
              BASE_CODENAME="${{ env.DEBIAN_VERSION }}"
              MIRROR="http://deb.debian.org/debian/"
              SOURCES_TEMPLATE="debian"
              MINT_CODENAME=""
              DISTRO_LABEL="Debian ${BASE_CODENAME}"
              ;;
            ubuntu)
              BASE_CODENAME="${{ env.UBUNTU_VERSION }}"
              MIRROR="http://archive.ubuntu.com/ubuntu/"
              SOURCES_TEMPLATE="ubuntu"
              MINT_CODENAME=""
              DISTRO_LABEL="Ubuntu ${BASE_CODENAME}"
              ;;
            linuxmint)
              # Linux Mint không có mirror debootstrap riêng — nó được build trên
              # nền Ubuntu, nên ta debootstrap Ubuntu base tương ứng rồi add
              # thêm repo Mint lên trên (giống cách Mint thật sự được build).
              case "${{ env.MINT_VERSION }}" in
                22)   BASE_CODENAME="noble"; MINT_CODENAME="wilma" ;;
                21.3) BASE_CODENAME="jammy"; MINT_CODENAME="virginia" ;;
                21.2) BASE_CODENAME="jammy"; MINT_CODENAME="victoria" ;;
                *)    BASE_CODENAME="noble"; MINT_CODENAME="wilma" ;;
              esac
              MIRROR="http://archive.ubuntu.com/ubuntu/"
              SOURCES_TEMPLATE="mint"
              DISTRO_LABEL="Linux Mint ${{ env.MINT_VERSION }} (${MINT_CODENAME}, nền Ubuntu ${BASE_CODENAME})"
              ;;
            *)
              echo "Distro không hợp lệ: ${{ env.BASE_DISTRO }}"
              exit 1
              ;;
          esac

          echo "Sẽ build trên: $DISTRO_LABEL"
          echo "BASE_CODENAME=$BASE_CODENAME" >> "$GITHUB_ENV"
          echo "MIRROR=$MIRROR" >> "$GITHUB_ENV"
          echo "SOURCES_TEMPLATE=$SOURCES_TEMPLATE" >> "$GITHUB_ENV"
          echo "MINT_CODENAME=$MINT_CODENAME" >> "$GITHUB_ENV"
          echo "DISTRO_LABEL=$DISTRO_LABEL" >> "$GITHUB_ENV"

      - name: Debootstrap base system
        run: |
          mkdir -p live-build/chroot
          sudo debootstrap --arch=amd64 --variant=minbase \
            "${{ env.BASE_CODENAME }}" live-build/chroot \
            "${{ env.MIRROR }}"

      - name: Mount virtual filesystems for chroot
        run: |
          sudo mount --bind /dev live-build/chroot/dev
          sudo mount --bind /run live-build/chroot/run
          sudo chroot live-build/chroot mount -t proc none /proc
          sudo chroot live-build/chroot mount -t sysfs none /sys

      - name: Configure APT sources inside chroot
        run: |
          case "${{ env.SOURCES_TEMPLATE }}" in
            debian)
              sudo tee live-build/chroot/etc/apt/sources.list > /dev/null <<EOF
          deb http://deb.debian.org/debian ${{ env.BASE_CODENAME }} main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian ${{ env.BASE_CODENAME }}-updates main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security ${{ env.BASE_CODENAME }}-security main contrib non-free non-free-firmware
          EOF
              ;;
            ubuntu)
              sudo tee live-build/chroot/etc/apt/sources.list > /dev/null <<EOF
          deb http://archive.ubuntu.com/ubuntu ${{ env.BASE_CODENAME }} main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu ${{ env.BASE_CODENAME }}-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu ${{ env.BASE_CODENAME }}-security main restricted universe multiverse
          EOF
              ;;
            mint)
              # base apt sources = Ubuntu tương ứng, cộng thêm repo chính thức của Mint
              sudo tee live-build/chroot/etc/apt/sources.list > /dev/null <<EOF
          deb http://archive.ubuntu.com/ubuntu ${{ env.BASE_CODENAME }} main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu ${{ env.BASE_CODENAME }}-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu ${{ env.BASE_CODENAME }}-security main restricted universe multiverse
          EOF
              sudo mkdir -p live-build/chroot/etc/apt/sources.list.d
              sudo tee live-build/chroot/etc/apt/sources.list.d/official-package-repositories.list > /dev/null <<EOF
          deb http://packages.linuxmint.com ${{ env.MINT_CODENAME }} main upstream import backport
          EOF
              ;;
          esac
          sudo cp /etc/resolv.conf live-build/chroot/etc/resolv.conf

      - name: Import Linux Mint APT signing key (chỉ khi distro = linuxmint)
        if: ${{ env.BASE_DISTRO == 'linuxmint' }}
        run: |
          sudo apt-get install -y gnupg
          curl -fsSL https://www.linuxmint.com/mint-repository-keyring/mint-archive-keyring.gpg \
            | sudo tee live-build/chroot/usr/share/keyrings/mint-archive-keyring.gpg > /dev/null || \
            sudo chroot live-build/chroot apt-key adv --keyserver keyserver.ubuntu.com \
              --recv-keys 27DE097940FC9D0FDBDCC2404E163382636958F6 || true
          sudo sed -i 's#^deb http://packages.linuxmint.com#deb [signed-by=/usr/share/keyrings/mint-archive-keyring.gpg] http://packages.linuxmint.com#' \
            live-build/chroot/etc/apt/sources.list.d/official-package-repositories.list || true

      - name: Install desktop environment + Plymouth + Calamares (in chroot)
        run: |
          cat <<'EOF' | sudo tee live-build/chroot/tmp/install.sh
          #!/bin/bash
          set -e
          [ "$DEBUG_MODE" = "true" ] && set -x
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y linux-image-generic live-boot systemd-sysv \
            plymouth plymouth-themes network-manager sudo locales tzdata \
            lsb-release calamares calamares-settings-debian || \
          apt-get install -y linux-image-amd64 live-boot systemd-sysv \
            plymouth plymouth-themes network-manager sudo locales tzdata \
            lsb-release calamares calamares-settings-debian

          # hostname
          echo "$OS_HOSTNAME" > /etc/hostname
          echo "127.0.1.1 $OS_HOSTNAME" >> /etc/hosts

          # timezone
          ln -sf "/usr/share/zoneinfo/$OS_TIMEZONE" /etc/localtime
          dpkg-reconfigure -f noninteractive tzdata || true

          if [ "$DE" = "kde" ]; then
            apt-get install -y kde-plasma-desktop sddm
          else
            apt-get install -y task-xfce-desktop lightdm lightdm-gtk-greeter \
              xfce4-whiskermenu-plugin git libgtk-3-bin

            # icon theme theo lựa chọn
            case "$ICON_THEME" in
              numix)   apt-get install -y numix-icon-theme ;;
              breeze)  apt-get install -y breeze-icon-theme ;;
              adwaita) apt-get install -y adwaita-icon-theme ;;
              *)       apt-get install -y papirus-icon-theme ;;
            esac

            # GTK theme cho khung cửa sổ/taskbar kiểu Windows 10 (B00merang-Project, open source)
            git clone --depth=1 https://github.com/B00merang-Project/Windows-10 \
              /usr/share/themes/Windows-10
          fi

          # trình duyệt / office (tùy chọn)
          [ "$INCLUDE_BROWSER" = "true" ] && apt-get install -y firefox-esr || \
            { [ "$INCLUDE_BROWSER" = "true" ] && apt-get install -y firefox; }
          [ "$INCLUDE_OFFICE" = "true" ] && apt-get install -y libreoffice

          # gói thêm do người dùng chỉ định
          if [ -n "$EXTRA_PACKAGES" ]; then
            apt-get install -y $EXTRA_PACKAGES || true
          fi

          # user mặc định cho live session
          useradd -m -s /bin/bash -G sudo "$OS_USERNAME" || true
          echo "$OS_USERNAME:$OS_PASSWORD" | chpasswd

          apt-get clean
          rm -rf /var/lib/apt/lists/*
          EOF
          sudo chmod +x live-build/chroot/tmp/install.sh
          sudo chroot live-build/chroot env \
            DE="${{ env.DE }}" \
            DEBUG_MODE="${{ env.DEBUG_MODE }}" \
            ICON_THEME="${{ env.ICON_THEME }}" \
            OS_USERNAME="${{ env.OS_USERNAME }}" \
            OS_PASSWORD="${{ env.OS_PASSWORD }}" \
            OS_HOSTNAME="${{ env.OS_HOSTNAME }}" \
            OS_TIMEZONE="${{ env.OS_TIMEZONE }}" \
            INCLUDE_BROWSER="${{ env.INCLUDE_BROWSER }}" \
            INCLUDE_OFFICE="${{ env.INCLUDE_OFFICE }}" \
            EXTRA_PACKAGES="${{ env.EXTRA_PACKAGES }}" \
            /tmp/install.sh 2>&1 | tee install-debug.log

      - name: (Optional) Copy custom branding / Plymouth theme / wallpapers
        run: |
          if [ -d "iso-config/branding" ]; then
            sudo cp -r iso-config/branding/* live-build/chroot/usr/share/plymouth/themes/ 2>/dev/null || true
          fi

          sudo mkdir -p live-build/chroot/usr/share/backgrounds/hyggshi

          # 1. Ưu tiên file wallpaper có sẵn trong repo (checkout local)
          WALLPAPER_FILE=$(find iso-config/branding -maxdepth 1 -iname "wallpaper.*" \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) 2>/dev/null | head -n1)

          # 2. Nếu không có, tải trực tiếp Wallpaper.png từ GitHub
          if [ -z "$WALLPAPER_FILE" ]; then
            echo "Không thấy wallpaper trong repo local, tải trực tiếp từ GitHub..."
            if curl -fsSL "${{ env.WALLPAPER_URL }}" -o /tmp/wallpaper-remote.png && [ -s /tmp/wallpaper-remote.png ]; then
              WALLPAPER_FILE=/tmp/wallpaper-remote.png
              echo "Tải thành công: ${{ env.WALLPAPER_URL }}"
            else
              echo "Tải thất bại từ raw.githubusercontent.com"
            fi
          fi

          # 3. Áp dụng, hoặc fallback gradient nếu cả 2 cách trên đều fail
          if [ -n "$WALLPAPER_FILE" ]; then
            sudo cp "$WALLPAPER_FILE" \
              live-build/chroot/usr/share/backgrounds/hyggshi/wallpaper.png
            echo "Đã dùng wallpaper: $WALLPAPER_FILE"
          else
            echo "⚠️  Không lấy được wallpaper — tự tạo wallpaper gradient tạm thời."
            sudo apt-get install -y imagemagick > /dev/null 2>&1 || true
            convert -size 1920x1080 gradient:'#1a2a4a-#0d1220' /tmp/wallpaper.png
            sudo cp /tmp/wallpaper.png \
              live-build/chroot/usr/share/backgrounds/hyggshi/wallpaper.png
          fi

      - name: Rebrand hệ thống (os-release, lsb-release, banner, distributor logo)
        run: |
          CHROOT=live-build/chroot

          # /etc/os-release - phần lớn tool (neofetch, GNOME/Xfce About, systemd) đọc file này
          # Debian mặc định để /etc/os-release là symlink -> ../usr/lib/os-release.
          # Ta xoá symlink cũ, ghi nội dung THẬT vào usr/lib/os-release, rồi tạo lại
          # /etc/os-release như một symlink TƯƠNG ĐỐI (không phải tuyệt đối) trỏ tới
          # nó. Dùng đường dẫn tuyệt đối "/etc/os-release" ở đây từng gây ra vòng lặp
          # symlink (etc -> usr/lib -> etc -> ...) khi đọc từ ngoài chroot, khiến
          # os-release thật sự đọc được lại là của máy host/runner.
          sudo rm -f "$CHROOT/etc/os-release" "$CHROOT/usr/lib/os-release"
          cat <<EOF | sudo tee "$CHROOT/usr/lib/os-release" > /dev/null
          PRETTY_NAME="${{ env.DISTRO_NAME }} 1.0 (dựa trên ${{ env.DISTRO_LABEL }})"
          NAME="${{ env.DISTRO_NAME }}"
          VERSION_ID="1.0"
          VERSION="1.0 (${{ env.DISTRO_LABEL }})"
          VERSION_CODENAME=${{ env.BASE_CODENAME }}
          ID=hyggshios
          ID_LIKE=${{ env.BASE_DISTRO == 'debian' && 'debian' || 'ubuntu debian' }}
          HOME_URL="https://github.com/Hyggshi-OS-Research-Technology"
          SUPPORT_URL="https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/issues"
          BUG_REPORT_URL="https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/issues"
          LOGO=distributor-logo
          EOF
          sudo ln -sf ../usr/lib/os-release "$CHROOT/etc/os-release"

          # /etc/lsb-release - lệnh `lsb_release -a` và nhiều app khác đọc file này
          cat <<EOF | sudo tee "$CHROOT/etc/lsb-release" > /dev/null
          DISTRIB_ID=HyggshiOS
          DISTRIB_RELEASE=1.0
          DISTRIB_CODENAME=${{ env.BASE_CODENAME }}
          DISTRIB_DESCRIPTION="${{ env.DISTRO_NAME }} 1.0 (${{ env.DISTRO_LABEL }})"
          EOF

          # banner khi login console (tty), không phải GUI
          printf "${{ env.DISTRO_NAME }} \\\\n \\\\l\n\n" | sudo tee "$CHROOT/etc/issue" > /dev/null
          echo "Welcome to ${{ env.DISTRO_NAME }} — built on ${{ env.DISTRO_LABEL }}" | \
            sudo tee "$CHROOT/etc/motd" > /dev/null

          # distributor logo - dùng cho About Xfce/GNOME, một số greeter
          LOGO_FILE=$(find iso-config/branding -maxdepth 1 -iname "logo.*" \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) 2>/dev/null | head -n1)
          if [ -n "$LOGO_FILE" ]; then
            sudo apt-get install -y imagemagick > /dev/null 2>&1 || true
            for size in 16 22 24 32 48 64 128 192 256; do
              DEST="$CHROOT/usr/share/icons/hicolor/${size}x${size}/apps"
              sudo mkdir -p "$DEST"
              convert "$LOGO_FILE" -resize ${size}x${size} "/tmp/logo-$size.png"
              sudo cp "/tmp/logo-$size.png" "$DEST/distributor-logo.png"
            done
            sudo chroot "$CHROOT" gtk-update-icon-cache -f /usr/share/icons/hicolor 2>/dev/null || true
            echo "Đã áp logo custom: $LOGO_FILE"
          else
            echo "⚠️  Không thấy file logo trong iso-config/branding/ — vẫn giữ logo mặc định của distro gốc."
            echo "    Thêm file logo.png (khuyến nghị 256x256, nền trong suốt) vào iso-config/branding/ để đổi logo."
          fi

      - name: Configure XFCE panel style + icon theme + wallpaper (skel profile)
        if: ${{ env.DE == 'xfce' }}
        run: |
          SKEL="live-build/chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml"
          sudo mkdir -p "$SKEL"

          case "${{ env.ICON_THEME }}" in
            numix)   ICON_NAME="Numix" ;;
            breeze)  ICON_NAME="breeze" ;;
            adwaita) ICON_NAME="Adwaita" ;;
            *)       ICON_NAME="Papirus" ;;
          esac

          if [ "${{ env.PANEL_STYLE }}" = "windows10" ]; then
          cat <<XML | sudo tee "$SKEL/xfce4-panel.xml" > /dev/null
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-panel" version="1.0">
            <property name="configver" type="int" value="2"/>
            <property name="panels" type="array">
              <value type="int" value="1"/>
              <property name="panel-1" type="empty">
                <property name="position" type="string" value="p=8;x=0;y=0"/>
                <property name="length" type="uint" value="100"/>
                <property name="length-adjust" type="bool" value="true"/>
                <property name="position-locked" type="bool" value="true"/>
                <property name="size" type="uint" value="34"/>
                <property name="mode" type="uint" value="0"/>
                <property name="autohide-behavior" type="uint" value="0"/>
                <property name="plugin-ids" type="array">
                  <value type="int" value="1"/>
                  <value type="int" value="2"/>
                  <value type="int" value="3"/>
                  <value type="int" value="4"/>
                  <value type="int" value="5"/>
                </property>
              </property>
            </property>
            <property name="plugins" type="empty">
              <property name="plugin-1" type="string" value="whiskermenu">
                <property name="button-title" type="string" value=""/>
                <property name="button-icon" type="string" value="start-here"/>
                <property name="show-button-title" type="bool" value="false"/>
              </property>
              <property name="plugin-2" type="string" value="tasklist">
                <property name="grouping" type="uint" value="1"/>
                <property name="show-labels" type="bool" value="false"/>
                <property name="show-handle" type="bool" value="false"/>
              </property>
              <property name="plugin-3" type="string" value="separator">
                <property name="expand" type="bool" value="true"/>
                <property name="style" type="uint" value="0"/>
              </property>
              <property name="plugin-4" type="string" value="systray"/>
              <property name="plugin-5" type="string" value="clock">
                <property name="digital-format" type="string" value="%H:%M  %d/%m/%Y"/>
                <property name="digital-layout" type="uint" value="2"/>
              </property>
            </property>
          </channel>
          XML
          fi

          cat <<XML | sudo tee "$SKEL/xfce4-desktop.xml" > /dev/null
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-desktop" version="1.0">
            <property name="backdrop" type="empty">
              <property name="screen0" type="empty">
                <property name="monitor0" type="empty">
                  <property name="workspace0" type="empty">
                    <property name="last-image" type="string" value="/usr/share/backgrounds/hyggshi/wallpaper.png"/>
                    <property name="image-style" type="int" value="5"/>
                  </property>
                </property>
              </property>
            </property>
          </channel>
          XML

          cat <<XML | sudo tee "$SKEL/xsettings.xml" > /dev/null
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xsettings" version="1.0">
            <property name="Net" type="empty">
              <property name="IconThemeName" type="string" value="$ICON_NAME"/>
              <property name="ThemeName" type="string" value="Windows-10"/>
            </property>
          </channel>
          XML

          cat <<XML | sudo tee "$SKEL/xfwm4.xml" > /dev/null
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfwm4" version="1.0">
            <property name="general" type="empty">
              <property name="theme" type="string" value="Windows-10"/>
              <property name="button_layout" type="string" value="O|SHMC"/>
            </property>
          </channel>
          XML

          sudo chroot live-build/chroot chown -R root:root /etc/skel/.config

          # === Script tự dò đúng property monitor/workspace + retry, chạy sau khi
          # xfdesktop thật sự khởi động (tránh race condition lúc login) ===
          cat <<'SCRIPT' | sudo tee live-build/chroot/usr/local/bin/hyggshi-set-wallpaper.sh > /dev/null
          #!/bin/bash
          LOG="/tmp/hyggshi-wallpaper.log"
          exec > "$LOG" 2>&1
          echo "=== hyggshi-set-wallpaper.sh $(date) ==="

          WALL="/usr/share/backgrounds/hyggshi/wallpaper.png"
          if [ ! -f "$WALL" ]; then
            echo "LỖI: không tìm thấy file wallpaper, dừng."
            exit 0
          fi

          # Chờ xfdesktop thật sự chạy (tối đa 15s), tránh race condition lúc login
          for i in $(seq 1 15); do
            if pgrep -x xfdesktop >/dev/null; then
              echo "xfdesktop đã chạy sau ${i}s"
              break
            fi
            sleep 1
          done
          sleep 1

          apply_wallpaper() {
            # liệt kê MỌI property last-image mà xfdesktop đang thực sự dùng
            # (tên monitor như "monitor0" không đúng trên mọi máy/VM, ví dụ QEMU
            # thường đặt tên khác như "Virtual-1")
            PROPS=$(xfconf-query -c xfce4-desktop -p /backdrop -l 2>/dev/null | grep 'last-image$')
            if [ -z "$PROPS" ]; then
              echo "Chưa có property nào, fallback monitor0/workspace0"
              PROPS="/backdrop/screen0/monitor0/workspace0/last-image"
            fi
            echo "PROPS tìm được:"
            echo "$PROPS"

            while read -r PROP; do
              [ -z "$PROP" ] && continue
              STYLE="${PROP%last-image}image-style"
              xfconf-query -c xfce4-desktop -p "$PROP" -n -t string -s "$WALL" 2>>"$LOG" \
                || xfconf-query -c xfce4-desktop -p "$PROP" -s "$WALL" 2>>"$LOG"
              xfconf-query -c xfce4-desktop -p "$STYLE" -n -t int -s 5 2>>"$LOG" \
                || xfconf-query -c xfce4-desktop -p "$STYLE" -s 5 2>>"$LOG"
              echo "Set $PROP -> $WALL"
            done <<< "$PROPS"
          }

          apply_wallpaper
          xfdesktop --reload 2>>"$LOG"
          sleep 1

          echo "--- verify sau khi set ---"
          CHECK=$(xfconf-query -c xfce4-desktop -p /backdrop -l 2>/dev/null | grep 'last-image$' | head -n1)
          if [ -n "$CHECK" ]; then
            VAL=$(xfconf-query -c xfce4-desktop -p "$CHECK" 2>/dev/null)
            echo "verify: $CHECK = $VAL"
            if [ "$VAL" != "$WALL" ]; then
              echo "Verify không khớp, retry lần 2 + restart xfdesktop"
              apply_wallpaper
              killall xfdesktop 2>>"$LOG"
              sleep 1
              nohup xfdesktop >>"$LOG" 2>&1 &
            fi
          fi

          echo "=== xong ==="
          SCRIPT
          sudo chmod +x live-build/chroot/usr/local/bin/hyggshi-set-wallpaper.sh

          sudo mkdir -p live-build/chroot/etc/skel/.config/autostart
          cat <<'DESKTOP' | sudo tee live-build/chroot/etc/skel/.config/autostart/hyggshi-wallpaper.desktop > /dev/null
          [Desktop Entry]
          Type=Application
          Name=Hyggshi Wallpaper Setup
          Exec=/usr/local/bin/hyggshi-set-wallpaper.sh
          X-GNOME-Autostart-enabled=true
          NoDisplay=true
          DESKTOP

          # user đã được tạo (useradd -m) TRƯỚC bước này nên đã copy sẵn config
          # skel cũ. Ghi đè thẳng vào home để tránh dính config panel mặc định.
          USER_HOME="live-build/chroot/home/${{ env.OS_USERNAME }}"
          sudo rm -rf "$USER_HOME/.config/xfce4" "$USER_HOME/.config/autostart" "$USER_HOME/.cache"
          sudo mkdir -p "$USER_HOME/.config"
          sudo cp -r live-build/chroot/etc/skel/.config/xfce4 "$USER_HOME/.config/xfce4"
          sudo cp -r live-build/chroot/etc/skel/.config/autostart "$USER_HOME/.config/autostart"
          sudo chroot live-build/chroot chown -R "${{ env.OS_USERNAME }}:${{ env.OS_USERNAME }}" \
            "/home/${{ env.OS_USERNAME }}/.config"

      - name: Unmount chroot filesystems
        run: |
          sudo chroot live-build/chroot umount /proc || true
          sudo chroot live-build/chroot umount /sys || true
          sudo umount live-build/chroot/run || true
          sudo umount live-build/chroot/dev || true

      - name: Collect debug info (chỉ khi debug_mode = true)
        if: ${{ env.DEBUG_MODE == 'true' }}
        run: |
          CHROOT=live-build/chroot
          {
            echo "===== Inputs / env ====="
            echo "BASE_DISTRO=${{ env.BASE_DISTRO }} | BASE_CODENAME=${{ env.BASE_CODENAME }} | DISTRO_LABEL=${{ env.DISTRO_LABEL }}"
            echo "DE=${{ env.DE }} | PANEL_STYLE=${{ env.PANEL_STYLE }} | ICON_THEME=${{ env.ICON_THEME }}"
            echo "OS_USERNAME=${{ env.OS_USERNAME }} | OS_HOSTNAME=${{ env.OS_HOSTNAME }} | OS_TIMEZONE=${{ env.OS_TIMEZONE }}"
            echo

            echo "===== Disk usage (runner) ====="
            df -h
            echo

            echo "===== iso-config/branding contents ====="
            find iso-config/branding -type f -exec ls -la {} \; 2>/dev/null || echo "(không có thư mục iso-config/branding)"
            echo

            echo "===== /etc/apt/sources.list trong chroot ====="
            cat "$CHROOT/etc/apt/sources.list" 2>/dev/null || true
            echo

            echo "===== /etc/apt/sources.list.d/ trong chroot ====="
            shopt -s nullglob
            for f in "$CHROOT"/etc/apt/sources.list.d/*; do
              echo "--- $f ---"
              cat "$f" || true
            done
            shopt -u nullglob
            echo

            echo "===== /etc/os-release trong chroot ====="
            cat "$CHROOT/etc/os-release" 2>/dev/null || true
            echo

            echo "===== /etc/lsb-release trong chroot ====="
            cat "$CHROOT/etc/lsb-release" 2>/dev/null || true
            echo

            echo "===== backgrounds/hyggshi trong chroot ====="
            ls -la "$CHROOT/usr/share/backgrounds/hyggshi/" 2>/dev/null || true
            echo

            echo "===== distributor-logo đã ghi vào hicolor (128x128) ====="
            ls -la "$CHROOT/usr/share/icons/hicolor/128x128/apps/" 2>/dev/null | grep distributor || true
            echo

            echo "===== /usr/local/bin/hyggshi-set-wallpaper.sh ====="
            cat "$CHROOT/usr/local/bin/hyggshi-set-wallpaper.sh" 2>/dev/null || true
            echo

            echo "===== ~/.config/autostart của user ====="
            ls -la "$CHROOT/home/${{ env.OS_USERNAME }}/.config/autostart/" 2>/dev/null || true
            echo

            echo "===== xfconf xfce4-desktop.xml (skel) ====="
            cat "$CHROOT/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml" 2>/dev/null || true
            echo

            echo "===== xfconf xfce4-panel.xml (skel) ====="
            cat "$CHROOT/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml" 2>/dev/null || true
          } > debug-info.txt

          echo "----- debug-info.txt preview -----"
          cat debug-info.txt

      - name: Upload debug artifact (log build + debug-info.txt)
        if: ${{ env.DEBUG_MODE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-debug
          path: |
            install-debug.log
            debug-info.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Build squashfs from chroot
        run: |
          mkdir -p live-build/image/live
          sudo mksquashfs live-build/chroot live-build/image/live/filesystem.squashfs \
            -e boot -comp xz

      - name: Prepare boot files (kernel + initrd)
        run: |
          mkdir -p live-build/image/live
          sudo cp live-build/chroot/boot/vmlinuz-* live-build/image/live/vmlinuz
          sudo cp live-build/chroot/boot/initrd.img-* live-build/image/live/initrd

      - name: Build bootable ISO with grub
        run: |
          mkdir -p live-build/image/boot/grub
          cat <<EOF > live-build/image/boot/grub/grub.cfg
          set timeout=10
          set default=0
          menuentry "${{ env.DISTRO_NAME }} Live" {
            linux /live/vmlinuz boot=live quiet splash
            initrd /live/initrd
          }
          EOF

          sudo grub-mkrescue -o "${{ env.ISO_FILENAME }}" live-build/image \
            --compress=xz -- -volid "HYGGSHI_OS"

          ls -lh "${{ env.ISO_FILENAME }}"

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-iso
          path: ${{ env.ISO_FILENAME }}
          retention-days: 14

      - name: Attach ISO to GitHub Release (optional)
        if: ${{ github.event.inputs.release_iso == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ISO_FILENAME }}
          tag_name: "hyggshi-os-${{ github.run_number }}"
          name: "Hyggshi OS build #${{ github.run_number }}"
