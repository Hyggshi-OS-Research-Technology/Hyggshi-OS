name: Build Hyggshi OS ISO

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "Tên hiển thị của bản phân phối (đổi tên base linux — ghi vào os-release/hostname/GRUB/ISO label...)"
        required: false
        default: "Hyggshi OS"
      distro:
        description: "Bản phân phối gốc (base distro)"
        required: false
        type: choice
        options: [debian, ubuntu, linuxmint, alpine, arch, fedora]
        default: "debian"
      debian_version:
        description: "Phiên bản Debian (chỉ áp dụng khi distro = debian)"
        required: false
        type: choice
        options: [trixie, bookworm, bullseye]
        default: "trixie"
      ubuntu_version:
        description: "Phiên bản Ubuntu (chỉ áp dụng khi distro = ubuntu)"
        required: false
        type: choice
        options: [noble, mantic, jammy, focal]
        default: "noble"
      mint_version:
        description: "Phiên bản Linux Mint (chỉ áp dụng khi distro = linuxmint)"
        required: false
        type: choice
        options: ["22", "21.3", "21.2"]
        default: "22"
      wallpaper_url:
        description: "Link ảnh wallpaper (dán trực tiếp URL .png/.jpg, vd link raw GitHub) — để trống dùng ảnh mặc định trong repo"
        required: false
        default: "https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Wallpaper.png?raw=true"
      logo_url:
        description: "Link ảnh distributor logo (dán trực tiếp URL .png/.jpg) — dùng cho icon hệ thống, để trống dùng ảnh mặc định trong repo"
        required: false
        default: "https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Logo.png?raw=true"
      plymouth_logo_url:
        description: "Link ảnh logo cho màn hình chờ boot Plymouth (dán trực tiếp URL .png/.jpg) — để trống sẽ dùng lại logo_url ở trên"
        required: false
        default: "https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Logo.png?raw=true"
      alpine_version:
        description: "Phiên bản Alpine (chỉ áp dụng khi distro = alpine — EXPERIMENTAL, mới bootstrap base rootfs, chưa có desktop/branding/iso riêng cho Alpine)"
        required: false
        type: choice
        options: ["v3.20", "v3.19", "edge"]
        default: "v3.20"
      fedora_version:
        description: "Phiên bản Fedora (chỉ áp dụng khi distro = fedora — EXPERIMENTAL, dùng dnf --installroot + dracut dmsquash-live, chưa test trên phần cứng/VM thật)"
        required: false
        type: choice
        options: ["41", "40", "rawhide"]
        default: "41"
      edition:
        description: "Edition (chỉnh thông số kernel — chỉ áp dụng khi distro = debian, arch hoặc fedora)"
        required: false
        type: choice
        options: [normal, developer, server, lite]
        default: "normal"
      desktop:
        description: "Desktop environment (6 lựa chọn)"
        required: false
        type: choice
        options: [xfce, kde, lxqt, gnome, mate, cinnamon]
        default: "xfce"
      panel_style:
        description: "Kiểu taskbar (chỉ áp dụng cho XFCE)"
        required: false
        type: choice
        options: [windows10, classic]
        default: "windows10"
      icon_theme:
        description: "Bộ icon (chỉ áp dụng cho XFCE)"
        required: false
        type: choice
        options: [papirus, numix, breeze, adwaita]
        default: "papirus"
      username:
        description: "Username mặc định trong live session"
        required: false
        default: "hyggshi"
      user_password:
        description: "Mật khẩu user (plaintext, chỉ dùng cho ISO test)"
        required: false
        default: "hyggshi"
      hostname:
        description: "Hostname máy"
        required: false
        default: "hyggshi-os"
      timezone:
        description: "Múi giờ (vd Asia/Ho_Chi_Minh, UTC)"
        required: false
        default: "Asia/Ho_Chi_Minh"
      include_browser:
        description: "Cài sẵn Firefox ESR?"
        type: boolean
        default: true
      include_office:
        description: "Cài sẵn LibreOffice?"
        type: boolean
        default: false
      extra_packages:
        description: "Gói apt thêm, cách nhau bằng dấu cách (vd: vlc gimp htop)"
        required: false
        default: ""
      release_iso:
        description: "Attach ISO to a GitHub Release?"
        type: boolean
        default: false
      debug_mode:
        description: "Bật debug (log chi tiết + xuất debug-info.txt kèm ISO)"
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-hyggshi-os.yml"
      - "scripts/**"
      - "iso-config/**"

env:
  DISTRO_NAME: ${{ github.event.inputs.distro_name || 'Hyggshi OS' }}
  BASE_DISTRO: ${{ github.event.inputs.distro || 'debian' }}
  EDITION: ${{ github.event.inputs.edition || 'normal' }}
  # LƯU Ý: debian_version/ubuntu_version/mint_version/alpine_version KHÔNG đặt
  # ở đây. Nếu đặt cứng ở env cấp workflow, GitHub Actions in TOÀN BỘ 4 biến
  # ra log của MỌI step (kể cả 3 biến không liên quan tới distro đã chọn —
  # ví dụ chọn debian vẫn thấy UBUNTU_VERSION/MINT_VERSION/ALPINE_VERSION),
  # gây hiểu lầm là chúng có tác dụng. Thay vào đó, step "Resolve version
  # theo distro đã chọn" bên dưới chỉ export ĐÚNG 1 biến khớp với
  # $BASE_DISTRO vào $GITHUB_ENV — 3 biến còn lại không hề được set.
  ISO_FILENAME: "hyggshi-os-${{ github.run_number }}.iso"
  DE: ${{ github.event.inputs.desktop || 'xfce' }}
  PANEL_STYLE: ${{ github.event.inputs.panel_style || 'windows10' }}
  ICON_THEME: ${{ github.event.inputs.icon_theme || 'papirus' }}
  OS_USERNAME: ${{ github.event.inputs.username || 'hyggshi' }}
  OS_PASSWORD: ${{ github.event.inputs.user_password || 'hyggshi' }}
  OS_HOSTNAME: ${{ github.event.inputs.hostname || 'hyggshi-os' }}
  OS_TIMEZONE: ${{ github.event.inputs.timezone || 'Asia/Ho_Chi_Minh' }}
  INCLUDE_BROWSER: ${{ github.event.inputs.include_browser || 'true' }}
  INCLUDE_OFFICE: ${{ github.event.inputs.include_office || 'false' }}
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || '' }}
  DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
  # Link ảnh dán trực tiếp qua input — branding.sh tự tải nếu không có sẵn
  # file cùng tên trong iso-config/branding/ (xem WALLPAPER_FILE/LOGO_FILE/
  # PLYMOUTH_LOGO_FILE trong branding.sh). PLYMOUTH_LOGO_URL để trống sẽ
  # fallback dùng LOGO_URL (branding.sh tự xử lý).
  WALLPAPER_URL: ${{ github.event.inputs.wallpaper_url || 'https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Wallpaper.png?raw=true' }}
  LOGO_URL: ${{ github.event.inputs.logo_url || 'https://github.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/blob/main/iso-config/branding/Logo.png?raw=true' }}
  PLYMOUTH_LOGO_URL: ${{ github.event.inputs.plymouth_logo_url || '' }}

jobs:
  build-iso:
    runs-on: ubuntu-latest
    # Chỉ chạy cho các distro dùng debootstrap/apt (Debian/Ubuntu/Mint).
    # Alpine và Arch chạy ở 2 job riêng bên dưới, trong container gốc của
    # chính distro đó — xem ghi chú trong build-alpine.sh / build-arch.sh về
    # lý do (apk/pacman + keyring có sẵn, không cần giả lập trên Ubuntu).
    if: ${{ github.event.inputs.distro != 'alpine' && github.event.inputs.distro != 'arch' && github.event.inputs.distro != 'fedora' }}
    # debootstrap + chroot cần quyền root
    steps:
      - name: Checkout repo (scripts, config files, branding...)
        uses: actions/checkout@v4

      - name: Chmod +x cho toàn bộ scripts/
        run: find scripts -type f -name '*.sh' -exec chmod +x {} +

      # Chỉ export ĐÚNG 1 biến version khớp với $BASE_DISTRO. Các biến của
      # distro khác không hề tồn tại trong môi trường của các step sau —
      # không còn cảnh debian mà vẫn thấy UBUNTU_VERSION.
      - name: Resolve version theo distro đã chọn
        run: |
          case "$BASE_DISTRO" in
            debian)
              echo "DEBIAN_VERSION=${{ github.event.inputs.debian_version || 'trixie' }}" >> "$GITHUB_ENV" ;;
            ubuntu)
              echo "UBUNTU_VERSION=${{ github.event.inputs.ubuntu_version || 'noble' }}" >> "$GITHUB_ENV" ;;
            linuxmint)
              echo "MINT_VERSION=${{ github.event.inputs.mint_version || '22' }}" >> "$GITHUB_ENV" ;;
            *)
              echo "Distro không hợp lệ cho job build-iso: $BASE_DISTRO"
              exit 1 ;;
          esac

      # === 1) BUILD: resolve distro, debootstrap, mount, apt sources ===
      # build.sh chỉ là dispatcher: nó source đúng scripts/distros/build-<distro>.sh
      # bên trong (xem log con "Bootstrap rootfs riêng cho: ..."); tên step ở
      # đây ghi rõ distro để không cần mở log ra mới biết file nào đã chạy.
      - name: "[build.sh -> scripts/distros/build-${{ github.event.inputs.distro || 'debian' }}.sh] Chuẩn bị base rootfs"
        run: bash scripts/build.sh

      # === 2) DESKTOP: cài package/DE/user — chạy BÊN TRONG chroot ===
      - name: "[desktop.sh] Cài desktop environment (trong chroot)"
        run: |
          set -o pipefail
          sudo cp scripts/desktop.sh live-build/chroot/tmp/desktop.sh
          sudo cp scripts/kernel-tuning.sh live-build/chroot/tmp/kernel-tuning.sh
          sudo chmod +x live-build/chroot/tmp/desktop.sh
          sudo chroot live-build/chroot env \
            BASE_DISTRO="$BASE_DISTRO" \
            DE="$DE" \
            EDITION="$EDITION" \
            DEBUG_MODE="$DEBUG_MODE" \
            ICON_THEME="$ICON_THEME" \
            OS_USERNAME="$OS_USERNAME" \
            OS_PASSWORD="$OS_PASSWORD" \
            OS_HOSTNAME="$OS_HOSTNAME" \
            OS_TIMEZONE="$OS_TIMEZONE" \
            INCLUDE_BROWSER="$INCLUDE_BROWSER" \
            INCLUDE_OFFICE="$INCLUDE_OFFICE" \
            EXTRA_PACKAGES="$EXTRA_PACKAGES" \
            /tmp/desktop.sh 2>&1 | tee install-debug.log

      # === 3) BRANDING: wallpaper, logo, os-release, panel, autostart ===
      - name: "[branding.sh] Wallpaper / logo / rebrand / panel"
        run: |
          set -o pipefail
          bash scripts/branding.sh 2>&1 | tee branding-debug.log

      - name: Collect debug info (chỉ khi debug_mode = true)
        if: ${{ env.DEBUG_MODE == 'true' }}
        run: |
          CHROOT=live-build/chroot
          {
            echo "===== Inputs / env ====="
            echo "DISTRO_NAME=$DISTRO_NAME | EDITION=$EDITION"
            echo "BASE_DISTRO=$BASE_DISTRO | BASE_CODENAME=$BASE_CODENAME | DISTRO_LABEL=$DISTRO_LABEL"
            echo "DE=$DE | PANEL_STYLE=$PANEL_STYLE | ICON_THEME=$ICON_THEME"
            echo "OS_USERNAME=$OS_USERNAME | OS_HOSTNAME=$OS_HOSTNAME | OS_TIMEZONE=$OS_TIMEZONE"
            echo

            echo "===== Disk usage (runner) ====="
            df -h
            echo

            echo "===== iso-config/branding contents ====="
            find iso-config/branding -type f -exec ls -la {} \; 2>/dev/null || echo "(không có thư mục iso-config/branding)"
            echo

            echo "===== /etc/apt/sources.list trong chroot ====="
            sudo cat "$CHROOT/etc/apt/sources.list" 2>/dev/null || true
            echo

            echo "===== /etc/os-release trong chroot ====="
            sudo cat "$CHROOT/etc/os-release" 2>/dev/null || true
            echo

            echo "===== /etc/lsb-release trong chroot ====="
            sudo cat "$CHROOT/etc/lsb-release" 2>/dev/null || true
            echo

            echo "===== backgrounds/hyggshi trong chroot ====="
            sudo ls -la "$CHROOT/usr/share/backgrounds/hyggshi/" 2>/dev/null || true
            echo

            echo "===== distributor-logo đã ghi vào hicolor (128x128) ====="
            sudo ls -la "$CHROOT/usr/share/icons/hicolor/128x128/apps/" 2>/dev/null | grep distributor || true
            echo

            echo "===== /etc/xdg/autostart (system-wide) ====="
            sudo ls -la "$CHROOT/etc/xdg/autostart/" 2>/dev/null || true
            echo

            echo "===== update-alternatives desktop-background ====="
            sudo chroot "$CHROOT" update-alternatives --display desktop-background 2>&1 || true
            echo

            # LƯU Ý: sudo find có thể liệt kê được cả file bên trong
            # $CHROOT/home/<user> (thường mode 700), nhưng `cat` KHÔNG sudo
            # sẽ bị "Permission denied" khi đọc file trong đó -> exit code
            # khác 0 -> vì đây là lệnh CUỐI trong pipe (while), dưới `set -e`
            # (shell mặc định của GitHub Actions) toàn bộ step sẽ bị abort
            # NGAY LẬP TỨC và không in được dòng nào ra debug-info.txt.
            # Fix: thêm `sudo` vào cat, và `|| true` chặn an toàn cho cả pipeline.
            echo "===== Mọi file xfce4-desktop.xml tìm thấy trong hệ thống ====="
            sudo find "$CHROOT/etc/xdg" "$CHROOT/usr/share" "$CHROOT/home" \
              -name "xfce4-desktop.xml" 2>/dev/null | while read -r f; do
              echo "--- $f ---"
              sudo cat "$f" 2>/dev/null
            done || true
          } > debug-info.txt

          echo "----- debug-info.txt preview -----"
          cat debug-info.txt

      - name: Upload debug artifact (log build + debug-info.txt)
        if: ${{ env.DEBUG_MODE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-debug
          path: |
            install-debug.log
            branding-debug.log
            debug-info.txt
          retention-days: 14
          if-no-files-found: ignore

      # === 4) ISO: unmount, squashfs, grub, đóng gói ISO ===
      - name: "[iso.sh] Build squashfs + ISO bootable"
        run: bash scripts/iso.sh

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-iso
          path: ${{ env.ISO_FILENAME }}
          retention-days: 14

      - name: Attach ISO to GitHub Release (optional)
        if: ${{ github.event.inputs.release_iso == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ISO_FILENAME }}
          tag_name: "hyggshi-os-${{ github.run_number }}"
          name: "Hyggshi OS build #${{ github.run_number }}"

  # ============================================================
  # Job riêng cho Alpine: chạy TRONG container alpine:latest thay vì giả lập
  # apk trên ubuntu-latest. Trong container này tiến trình đã là root, apk đã
  # có sẵn — build-alpine.sh không cần sudo / apk-tools-static nữa.
  # EXPERIMENTAL: chỉ dựng base rootfs, chưa có desktop/branding/ISO cho
  # Alpine (xem ghi chú trong scripts/distros/build-alpine.sh).
  # ============================================================
  build-alpine:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.distro == 'alpine' }}
    container:
      image: ${{ (github.event.inputs.alpine_version == 'v3.19' && 'alpine:3.19') || (github.event.inputs.alpine_version == 'edge' && 'alpine:edge') || 'alpine:3.20' }}
    steps:
      - name: Cài build tools (apk add trong container)
        run: |
          apk add --no-cache bash coreutils curl xz tar squashfs-tools grub grub-bios xorriso

      - name: Checkout repo (scripts, config files, branding...)
        uses: actions/checkout@v4

      - name: Resolve Alpine version
        run: echo "ALPINE_VERSION=${{ github.event.inputs.alpine_version || 'v3.20' }}" >> "$GITHUB_ENV"

      - name: Chmod +x cho scripts/distros/build-alpine.sh
        run: chmod +x scripts/distros/build-alpine.sh

      - name: "[build-alpine.sh] Chuẩn bị base rootfs (native, trong container alpine)"
        run: bash scripts/distros/build-alpine.sh

      # Alpine hiện chỉ dừng ở base rootfs (xem build-alpine.sh) — đóng gói
      # rootfs thành tarball thay vì cố build ISO, để job kết thúc THÀNH
      # CÔNG và có artifact xem được.
      - name: Đóng gói base rootfs thành tarball
        run: |
          echo "Alpine base rootfs build xong — chưa có desktop/branding/ISO cho Alpine."
          tar -C live-build/chroot -cJf hyggshi-os-alpine-rootfs.tar.xz .
          ls -lh hyggshi-os-alpine-rootfs.tar.xz

      - name: Upload Alpine rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-alpine-rootfs
          path: hyggshi-os-alpine-rootfs.tar.xz
          retention-days: 14

  # ============================================================
  # Job riêng cho Arch: chạy TRONG container archlinux:latest, dùng
  # mkarchiso (công cụ chính chủ archlinux.org) để build ISO THẬT (bootable),
  # thay vì chỉ dựng base rootfs như trước. Xem chi tiết trong
  # scripts/distros/build-arch-iso.sh.
  # ============================================================
  build-arch:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.distro == 'arch' }}
    container:
      image: archlinux:latest
      # mkarchiso (giống pacstrap) tự mount /proc, /sys, /dev bind vào bên
      # trong target để chroot vào cài gói — việc mount này cần CAP_SYS_ADMIN,
      # nhưng container mặc định trên GitHub Actions KHÔNG có capability đó
      # (Docker rút gọn quyền theo mặc định) -> chết với "mount: ... permission
      # denied" / "ERROR: failed to setup chroot". --privileged cấp lại đủ
      # quyền để mkarchiso tự mount được.
      options: --privileged
    steps:
      - name: Checkout repo (scripts, config files, branding...)
        uses: actions/checkout@v4

      - name: Chmod +x cho scripts/distros/build-arch-iso.sh
        run: chmod +x scripts/distros/build-arch-iso.sh

      - name: "[build-arch-iso.sh] Build ISO bằng mkarchiso"
        run: bash scripts/distros/build-arch-iso.sh

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-iso
          path: ${{ env.ISO_FILENAME }}
          retention-days: 14

      - name: Attach ISO to GitHub Release (optional)
        if: ${{ github.event.inputs.release_iso == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ISO_FILENAME }}
          tag_name: "hyggshi-os-${{ github.run_number }}"
          name: "Hyggshi OS build #${{ github.run_number }}"

  # ============================================================
  # Job riêng cho Fedora: chạy TRONG container fedora:$FEDORA_VERSION
  # (--privileged, giống build-arch — build-fedora.sh cần mount --bind
  # /dev /proc /sys /run để chroot chạy đúng rpm %post scriptlet của
  # systemd/glibc/kernel + dracut). Dùng dnf --installroot + dracut
  # dmsquash-live (đúng công nghệ Fedora Live/Workstation ISO thật) — xem
  # chi tiết + cảnh báo EXPERIMENTAL trong scripts/distros/build-fedora.sh.
  # ============================================================
  build-fedora:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.distro == 'fedora' }}
    container:
      image: ${{ (github.event.inputs.fedora_version == '40' && 'fedora:40') || (github.event.inputs.fedora_version == 'rawhide' && 'fedora:rawhide') || 'fedora:41' }}
      options: --privileged
    steps:
      - name: "Cài build tools trên HOST (container fedora — build-fedora.sh chỉ cài vào --installroot, không tự cài công cụ cho chính host)"
        run: |
          # LƯU Ý: grub2-mkrescue KHÔNG nằm trong gói "grub2-tools" — trên Fedora
          # nó được đóng gói riêng trong "grub2-tools-extra" (khác Debian, nơi
          # grub-mkrescue nằm ngay trong grub-common/grub-pc-bin). Thiếu gói này
          # gây lỗi "grub2-mkrescue: command not found" ở bước build ISO cuối.
          dnf install -y --setopt=install_weak_deps=False \
            squashfs-tools grub2-tools grub2-tools-extra grub2-pc-modules grub2-efi-x64-modules \
            xorriso mtools rsync util-linux

      - name: Checkout repo (scripts, config files, branding...)
        uses: actions/checkout@v4

      - name: Resolve Fedora version
        run: echo "FEDORA_VERSION=${{ github.event.inputs.fedora_version || '41' }}" >> "$GITHUB_ENV"

      - name: Chmod +x cho scripts/distros/build-fedora.sh
        run: chmod +x scripts/distros/build-fedora.sh

      - name: "[build-fedora.sh] Bootstrap dnf --installroot + build ISO (dracut dmsquash-live)"
        run: bash scripts/distros/build-fedora.sh

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-iso
          path: ${{ env.ISO_FILENAME }}
          retention-days: 14

      - name: Attach ISO to GitHub Release (optional)
        if: ${{ github.event.inputs.release_iso == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ISO_FILENAME }}
          tag_name: "hyggshi-os-${{ github.run_number }}"
          name: "Hyggshi OS build #${{ github.run_number }}"
