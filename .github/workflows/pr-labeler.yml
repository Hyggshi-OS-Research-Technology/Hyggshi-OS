name: "PR Auto Labeler"

on:
  pull_request_target:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: "Tự động gắn nhãn theo phân hệ"
    runs-on: ubuntu-latest
    steps:
      - name: "Apply Labels"
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: ".github/labeler.yml"
          sync-labels: false
