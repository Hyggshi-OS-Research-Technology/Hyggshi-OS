linux-firmware = ${Call-mint-firmware}
intel-microcode = ${Call-mint-firmware}
amd64-microcode = ${Call-mint-firmware}
mesa-vulkan-drivers = ${Call-mint-firmware}
os-prober = ${Call-mint-firmware}
pciutils = ${Call-mint-firmware}
usbutils = ${Call-mint-firmware}

;==========
; firmware for Fedora [ADDED — Base.Fedora tồn tại nhưng chưa có firmware section]
;==========

[firmware-fedora]
linux-firmware = ${Call-fedora-firmware}
microcode_ctl = ${Call-fedora-firmware}
mesa-dri-drivers = ${Call-fedora-firmware}
mesa-vulkan-drivers = ${Call-fedora-firmware}
os-prober = ${Call-fedora-firmware}
pciutils = ${Call-fedora-firmware}
usbutils = ${Call-fedora-firmware}

;==========
; firmware for Alpine [ADDED — Base.Alpine tồn tại nhưng chưa có firmware section]
;==========

[firmware-alpine]
linux-firmware = ${Call-alpine-firmware}
mesa-dri-gallium = ${Call-alpine-firmware}
mesa-vulkan-ati = ${Call-alpine-firmware}
pciutils = ${Call-alpine-firmware}
usbutils = ${Call-alpine-firmware}

;==========
; firmware for Arch [ADDED — Base.Arch tồn tại nhưng chưa có firmware section]
;==========

[firmware-arch]
linux-firmware = ${Call-arch-firmware}
intel-ucode = ${Call-arch-firmware}
amd-ucode = ${Call-arch-firmware}
mesa = ${Call-arch-firmware}
vulkan-radeon = ${Call-arch-firmware}
vulkan-intel = ${Call-arch-firmware}
os-prober = ${Call-arch-firmware}
pciutils = ${Call-arch-firmware}
usbutils = ${Call-arch-firmware}

;==========Start of customization==========

[customization]

;==========
; customization for Calamares
;==========

; linkcombocalamares = filecustom(./iso-config/calamares/)
linksettingscalamares = filecustom(./iso-config/calamares/settings.conf)
linkbrandingcalamares = filecustom(./iso-config/calamares/branding/)
linkmodulescalamares = filecustom(./iso-config/calamares/modules/)

;==========
; customization for Plymouth
;==========

linkimagelogo = filecustom(./iso-config/branding/Logo.png)
; linkimagebackground = []

linkplymouth = command(
    file = "./scripts/plymouth.sh"
    action = run
)

;==========
; add logo gnome settings
;==========

remove-link-logo-gnome = fileremove(
    run = "sudo rm -rf /usr/share/icons/desktop-base"
)

add-logo-gnome-settings = copy(
    source = "./iso-config/branding/desktop-base"
    target = "/usr/share/icons/desktop-base"
)

;==========
; customization for background desktop image
;==========

linkimagebackground = filecustom(./iso-config/branding/Verdant-Valley.png)

;==========
; customization for Nexfetch logo
;==========

;linkimagelogonexfetch = filecustom(./iso-config/branding/logo.txt) ;; txt, image or default no logo

;==========
; customization for grub bootloader [ADDED — có sẵn desktop-grub.png/.svg trong
; iso-config/branding/ nhưng section này trước đó bị bỏ trống]
;==========

linkgrubbackground = filecustom(./iso-config/branding/desktop-grub.png)
;linkgrubtheme = filecustom(./iso-config/branding/desktop-grub.svg) ;; bản SVG, dùng nếu theme grub hỗ trợ vector

;==========
; customization for LightDM Greeter GTK theme
;==========

greeter-gtk-theme = copy(
    source = "./iso-config/branding/gtk.css"
    rename = "gtk.css"
    target = "/usr/share/themes/Hyggshi-Greeter/gtk-3.0/"
)

;==========END OF CUSTOMIZATION==========

;==========Start of compilers==========

[compilers]

; Build và cài đặt Hyggshi Sound Shortcut (daemon phím tắt âm thanh + OSD) 
; vào /tmp/ trước khi desktop.sh chạy.
linkhyggshi-sound-shortcut = command( ; for xfce
    file = "./app-for-hyggshi/sound-shortcut.sh"
    action = run
)

linkhyggshi-welcome = command(
    file = "./app-for-hyggshi/welcome.sh"
    action = run
)

;==========END OF COMPILERS==========

;==========Start of kernel==========

[kernel]

;==========
; kernel Devlopment
;==========
[kernel.Development]
vm.swappiness = 10
vm.vfs_cache_pressure = 50
fs.inotify.max_user_watches = 524288
fs.file-max = 2097152
kernel.nmi_watchdog = 0
;desktop = lxqt

;==========
; kernel Server
;==========
[kernel.Server]
vm.swappiness = 10
vm.vfs_cache_pressure = 50
fs.file-max = 2097152
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
kernel.nmi_watchdog = 0
desktop = cli

;==========
; kernel High-class
;==========

[kernel.High-class]

vm.swappiness = 10
vm.vfs_cache_pressure = 50
fs.file-max = 2097152
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
kernel.nmi_watchdog = 0
;desktop = gnome

;==========
; kernel Desktop
;==========

; Hyggshi OS — Edition: Normal/Desktop
[kernel.Desktop]
vm.swappiness = default
vm.vfs_cache_pressure = default
fs.file-max = default
net.core.somaxconn = default
net.ipv4.tcp_max_syn_backlog = default
kernel.nmi_watchdog = default
;desktop = cinnamon

;==========
; kernel Lite
;==========

; Hyggshi OS — Edition: Lite
; thấp = tốt" áp dụng cho swap trên đĩa (developer/server ở trên).
[kernel.Lite]
vm.swappiness = 40
vm.vfs_cache_pressure = 50
vm.watermark_scale_factor = 400
kernel.nmi_watchdog = 0
swap = 2GB
desktop = lxqt
openbox = true
apply-openbox = true
apply-xfwm4 = false
fs.inotify.max_user_watches = 1048576
fs.file-max = 2097152

;==========END OF KERNEL==========

;==========Start of Easter_Egg==========

[Easter_Egg]

make-Easter-Egg = false
;make-Easter-Egg-url = make(./app-for-hyggshi/Easter-Egg)

;==========END OF Easter_Egg==========
