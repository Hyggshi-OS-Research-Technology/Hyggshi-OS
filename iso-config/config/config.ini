;==========Start of compilers==========

linkhyggshi-welcome = command(
    file = "./app-for-hyggshi/welcome.sh"
    action = run
)

;==========END OF COMPILERS==========

;==========Start of kernel==========

[kernel]

;==========
; kernel Devlopment
;==========
[kernel.Development]
vm.swappiness = 10
vm.vfs_cache_pressure = 50
fs.inotify.max_user_watches = 524288
fs.file-max = 2097152
kernel.nmi_watchdog = 0
desktop = lxqt

;==========
; kernel Server
;==========
[kernel.Server]
vm.swappiness = 10
vm.vfs_cache_pressure = 50
fs.file-max = 2097152
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
kernel.nmi_watchdog = 0
desktop = cli

;==========
; kernel Desktop
;==========

; Hyggshi OS — Edition: Normal/Desktop
[kernel.Desktop]
vm.swappiness = default
vm.vfs_cache_pressure = default
fs.file-max = default
net.core.somaxconn = default
net.ipv4.tcp_max_syn_backlog = default
kernel.nmi_watchdog = default
desktop = Cinnamon

;==========
; kernel line
;==========

; Hyggshi OS — Edition: Lite
; thấp = tốt" áp dụng cho swap trên đĩa (developer/server ở trên).
[kernel.Lite]
vm.swappiness = 80
vm.vfs_cache_pressure = 50
vm.watermark_scale_factor = 200
kernel.nmi_watchdog = 0
desktop = Xfce

;==========END OF KERNEL==========

;==========Start of Easter_Egg==========

make-Easter-Egg = false
;make-Easter-Egg-url = make(./app-for-hyggshi/Easter-Egg)

;==========END OF Easter_Egg==========

