; Hyggshi Configuration Language (HCL)
; An INI-like domain-specific language used to define Hyggshi OS
; base systems, packages, desktop environments, kernel profiles, customization, and build actions.
;==========Start of base==========

[Base]

Debian =   false
Ubuntu =  true
Mint =    false
Fedora =  false
Alpine =  false
Arch =    false

[version-base-Original]

Debian =   13.6
Ubuntu =  "24.04 lts"
Mint =    22.3
Fedora =  41
Alpine =  3.22.5
Arch =    2026.07.01

[my-version-os-base]

Version = 1.4.0
name = "Hyggshi OS ${Version} ${codename} ${Base} Edition"
codename = "Verdant Valley"
kernel =   "Desktop" ; call kernel line in [kernel] section
base =     ${Base}  ; call base in [Base] section
firmware = Call-ubuntu-firmware  ; call firmware in [firmware-Debian] section

; (1GB > 1024MB, 2GB > 2048, custom > 4.2GB, false > null off )
; custom For example (swap = custom > 7.2GB)
;swap    = 1GB
swap    = false
config  = ${config-setup-postpartum-care}

[config-setup-postpartum-care]

Time-zone   = "UTC+0"
lang    = "default"
stylexfce   = "Windows10"
;makeshoutcut    = "install Hyggshi OS"

[Desktop-Environment]

Xfce =   false
Cinnamon = true
KDE =    false
lxqt =   false
gnome =  false
mate =   false
cli =   false

;==========END OF BASE==========

;==========Start of package==========

[package]

;==========
; Package test for Debian
;==========

; full > Package test
; normal > Package Normal
; default > false

package-debian-test = full

;==========
; compilers and tools
;==========

cmake =   true
git =     true
curl =    true
gcc =     true

;==========
; App Hyggshi OS Ecosystem
;==========

nexfetch = fileinstall(./app-for-hyggshi/nexfetch_1.0.0-1_amd64.deb)
nexfetchpreventive = fileinstall()

;==========
; XFCE
;==========

task-xfce-desktop =   true
xfce4 =              true
xfce4-goodies =     true
lightdm =              true
lightdm-gtk-greeter = true
xfce4-whiskermenu-plugin = true
libgtk-3-bin = true
x11-xserver-utils = true

;==========
; Cinnamon
;==========

task-cinnamon-desktop = true
cinnamon = true
cinnamon-control-center = true
cinnamon-screensaver = true
cinnamon-session = true
cinnamon-settings-daemon = true
cinnamon-translations = true
cjs = true
libcinnamon-desktop4 = true
libcinnamon-menu-editor0 = true
libcinnamon-settings-daemon4 = true

;==========
; KDE Plasma
;==========

task-kde-desktop = true
kde-plasma-desktop = true
sddm = true
plasma-workspace = true
plasma-nm = true
dolphin = true
konsole = true
kde-config-sddm = true

;==========
; LXQt
;==========

task-lxqt-desktop = true
lxqt = true
sddm = true
lxqt-panel = true
pcmanfm-qt = true
qterminal = true
lxqt-policykit = true

;==========
; GNOME
;==========

task-gnome-desktop = true
gnome-shell = true
gdm3 = true
gnome-session = true
gnome-terminal = true
nautilus = true
gnome-control-center = true

;==========
; MATE
;==========

task-mate-desktop = true
mate-desktop-environment = true
lightdm = true
lightdm-gtk-greeter = true
mate-terminal = true
caja = true

;==========
; CLI
;==========

task-ssh-server = true
openssh-server = true
tmux = true
vim = true

;==========
; firmware toggle [ADDED — Call-debian-firmware / Call-ubuntu-firmware được
; tham chiếu ở [firmware-Debian]/[firmware-ubuntu] nhưng chưa từng được định
; nghĩa ở đâu cả, nên thêm section này làm nguồn giá trị cho ${...}]
;==========
[firmware]
Call-debian-firmware = false
Call-ubuntu-firmware = true
Call-mint-firmware = false
Call-fedora-firmware = false
Call-alpine-firmware = false
Call-arch-firmware = false

;==========
; firmware for Debian
;==========
