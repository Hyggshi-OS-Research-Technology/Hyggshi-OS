    run = "sudo apt-get install -y gnome-disk-utility"
)

;==========END CALL GNOME APPS==========

;==========
; GNOME Extensions — CHỈ kích hoạt khi DE=gnome
; Parser nhận biết qua gnome-extensions = Call-gnome-extensions trong [my-version-os-base]
; Các DE khác (xfce, cinnamon, kde, lxqt, mate, cli) sẽ bỏ qua toàn bộ section này.
;==========

[call-gnome-extensions]

install-appindicator = add-extension-gnome(
    run = "sudo apt install -y gnome-shell-extension-appindicator && gnome-extensions enable appindicatorsupport@rgcjonas.gmail.com"
)

install-dash-to-panel = add-extension-gnome(
    run = "sudo apt install -y gnome-shell-extension-dash-to-panel && gnome-extensions enable dash-to-panel@jderose9.github.com"
)

install-user-themes = add-extension-gnome(
    run = "sudo apt install -y gnome-shell-extension-user-theme && gnome-extensions enable user-theme@gnome-shell-extensions.gcampax.github.com"
)

install-clipboard-indicator = add-extension-gnome(
    run = "pipx install gnome-extensions-cli --system-site-packages && gext install clipboard-indicator@tudmotu.com"
)

install-vitals = add-extension-gnome(
    run = "pipx install gnome-extensions-cli --system-site-packages && gext install Vitals@CoreCoding.com"
)

install-blur-my-shell = add-extension-gnome(
    run = "pipx install gnome-extensions-cli --system-site-packages && gext install blur-my-shell@aunetx"
)


;==========
; GNOME Tweaks — CHỈ kích hoạt khi DE=gnome
; Parser nhận biết qua gnome-tweak = Call-gnome-tweak trong [my-version-os-base]
; Các DE khác sẽ bỏ qua toàn bộ section này — gsettings chỉ có nghĩa với GNOME Shell.
;==========

[call-gnome-tweak]

install-tweaks-app = add-tweak-gnome(
    run = "sudo apt install -y gnome-tweaks dconf-editor"
)

add-appmenu-minimize-maximize-close = add-tweak-gnome(
    run = "gsettings set org.gnome.desktop.wm.preferences button-layout 'appmenu:minimize,maximize,close'"
)

set-clock-24h = add-tweak-gnome(
    run = "gsettings set org.gnome.desktop.interface clock-format '24h'"
)

set-dark-theme = add-tweak-gnome(
    run = "gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark' && gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'"
)

remap-capslock-to-ctrl = add-tweak-gnome(
    run = "gsettings set org.gnome.desktop.input-sources xkb-options \"['caps:ctrl_modifier']\""
)

;==========END CALL GNOME EXTENSIONS AND TWEAKS==========

