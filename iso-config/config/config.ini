; Hyggshi Configuration Language (HCL)
; An INI-like domain-specific language used to define Hyggshi OS
; base systems, packages, desktop environments, kernel profiles, customization, and build actions.
;==========Start of base==========

[Base]

Debian =   true
Ubuntu =  false
Mint =    false
Fedora =  false
Alpine =  false
Arch =    false

; Kiến trúc CPU của ISO build ra. ENUM giống [Base]: đúng 1 key = true.
; Song song với cờ "arm64" trong input feature_flags (Build-Hyggshi-OS-ISO.yml
; — KHÔNG có input "architecture" riêng vì workflow_dispatch giới hạn cứng
; 25 inputs, xem comment ở khối feature_flags trong file .yml) —
; giá trị THẬT lúc build lấy từ $ARCH (workflow input), section này là
; khai báo mặc định dùng cho local-build / validate HCL, giống quan hệ
; [Base] <-> input "distro" đã có từ trước.
;
; GIỚI HạN HIệN TạI (thành thật, giống cách README-HCL.md ghi các giới hạn
; khác): chỉ path debootstrap (build-debian.sh) + kernel/GRUB package
; (desktop.sh) đã arch-aware qua scripts/arch.sh. UEFI Secure Boot signing
; (iso.sh, shim/grub đã ký) hiện CHỈ hỗ trợ amd64 — build arm64 vẫn ra ISO
; boot được nhưng KHÔNG có secure boot chain (giống hành vi trước khi patch
; secure boot), tương tự cách Alpine/Fedora đang được đánh dấu EXPERIMENTAL
; trong workflow. Ubuntu/Mint distro job (build-ubuntu.sh/build-linuxmint.sh)
; và job container Arch/Fedora/Alpine CHƯA đọc $ARCH — vẫn hardcode amd64.
[Architecture]

amd64 = true
arm64 = false

[version-base-Original]

Debian =   13.6
Ubuntu =  "24.04 lts"
Mint =    22.3
Fedora =  41
Alpine =  3.22.5
Arch =    2026.07.01

[my-version-os-base]

Version = 1.4.0
name = "Hyggshi OS ${Version} ${codename} ${Base} Edition"
codename = "Verdant Valley"
kernel =   "Desktop" ; call kernel line in [kernel] section
base =     ${Base}  ; call base in [Base] section
firmware = Call-debian-firmware  ; call firmware in [firmware-Debian] section

; (1GB > 1024MB, 2GB > 2048, custom > 4.2GB, false > null off )
; custom For example (swap = custom > 7.2GB)
swap    = 1GB
;swap    = false
config  = ${config-setup-postpartum-care}

[config-setup-postpartum-care]

Time-zone   = "UTC+0"
lang    = "default"
stylexfce   = "Windows10"
;makeshoutcut    = "install Hyggshi OS"

; squashfs-max-compression: true  = nén filesystem.squashfs bằng xz mức nén
;                                   cao nhất (dung lượng ISO nhỏ nhất), build
;                                   chậm hơn đáng kể (xem scripts/iso.sh).
;                           false = giữ zstd -Xcompression-level 19 (mặc định,
;                                   nhanh hơn nhiều, ISO nhỉnh hơn 1 chút).
squashfs-max-compression = true

[Desktop-Environment]

Xfce =   true
Cinnamon = false
KDE =    false
lxqt =   false
gnome =  false
mate =   false
cli =   false

;==========END OF BASE==========

;==========Start of package==========

[package]

;==========
; Package test for Debian
;==========

; full > Package test
; normal > Package Normal
; default > false

package-debian-test = full

;==========
; add repository
;==========

[package-debian-test.full]

apt-target-file = "/etc/apt/sources.list"   

add-repository1 = fileaddtext(
    target  = "/etc/apt/sources.list"
    content = "deb http://deb.debian.org/debian testing main contrib non-free non-free-firmware"
)

add-repository2 = fileaddtext(
    target  = "/etc/apt/sources.list"
    content = "deb http://deb.debian.org/debian testing-updates main contrib non-free non-free-firmware"
)

add-repository3 = fileaddtext(
    target  = "/etc/apt/sources.list"
    content = "deb http://security.debian.org/debian-security testing-security main contrib non-free non-free-firmware"
)

[package-debian-test.normal]

apt-target-file = "/etc/apt/sources.list"

add-repository1 = fileaddtext(
    target  = "/etc/apt/sources.list"
    content = "deb http://deb.debian.org/debian testing main contrib non-free non-free-firmware"
)

add-repository2 = fileaddtext(
    target  = "/etc/apt/sources.list"
    content = "deb http://deb.debian.org/debian testing-updates main contrib non-free non-free-firmware"
)

add-repository3 = fileaddtext(
    target  = "/etc/apt/sources.list"
    content = "deb http://security.debian.org/debian-security stable-security main contrib non-free non-free-firmware"
)

[package-debian-test.default]

apt-target-file = "/etc/apt/sources.list"

add-repository1 = fileaddtext(
    target  = "/etc/apt/sources.list"
    content = "deb http://deb.debian.org/debian stable main contrib non-free non-free-firmware"
)

add-repository2 = fileaddtext(
    target  = "/etc/apt/sources.list"
    content = "deb http://deb.debian.org/debian stable-updates main contrib non-free non-free-firmware"
)

add-repository3 = fileaddtext(
    target  = "/etc/apt/sources.list"
    content = "deb http://security.debian.org/debian-security stable-security main contrib non-free non-free-firmware"
)

[package-debian-test.unstable]

apt-target-file = "/etc/apt/sources.list"

add-repository1 = fileaddtext(
    target  = "/etc/apt/sources.list"
    content = "deb http://deb.debian.org/debian testing main contrib non-free non-free-firmware"
)

add-repository2 = fileaddtext(
    target  = "/etc/apt/sources.list"
    content = "deb http://deb.debian.org/debian unstable-updates main contrib non-free non-free-firmware"
    components = "main contrib non-free non-free-firmware"
)

add-repository3 = fileaddtext(
    target  = "/etc/apt/sources.list"
    content = "deb http://security.debian.org/debian-security testing-security main contrib non-free non-free-firmware"
)

; ĐÓNG package-debian-test.unstable, MỞ LẠI [package] ở đây.
; BUG ĐÃ SỬA: từ dòng "; compilers and tools" trở xuống — cmake/git/curl/gcc,
; nexfetch/nexcode (fileinstall), theme Hyggshi-Light/Dark, VÀ TOÀN BỘ khối
; package của XFCE/Cinnamon/KDE/LXQt/GNOME/MATE/CLI/installer/icon/keyboard
; phía dưới — trước đây KHÔNG có "[package]" nào ở giữa để đóng section
; [package-debian-test.unstable] lại, nên toàn bộ các dòng key=value đó bị
; parser gán nhầm vào [package-debian-test.unstable] (section cuối cùng
; gặp trước đó) thay vì [package]. Hệ quả: resolve_package_groups() (chỉ
; đọc entries của đúng section "package") không bao giờ thấy các gói này
; -> HCL_PACKAGES/HCL_DESKTOP_PACKAGES/HCL_APP_INSTALLS luôn rỗng, tức là
; toàn bộ hệ thống chọn gói qua config.ini (bao gồm cả việc chỉ đưa đúng
; gói của DE đang active vào EXTRA_PACKAGES) chưa từng hoạt động — desktop.sh
; vẫn cài đúng DE vì nó có switch-case theo $DE riêng, không phụ thuộc
; HCL_PACKAGES, nhưng mọi khai báo package ở đây từ trước tới giờ là
; "chết", không có tác dụng gì với build thật.
[package]

;==========
; compilers and tools
;==========

cmake =   true
git =     true
curl =    true
gcc =     true

;==========
; App Hyggshi OS Ecosystem
;==========

nexfetch = fileinstall(./app-for-hyggshi/nexfetch_1.0.0-1_amd64.deb)
nexfetchpreventive = fileinstall()
nexcode = fileinstall(./app-for-hyggshi/nexcode-ide-3.5.7-Insider.9-amd64.deb)

