[config]
bm_open_method=0

[volume]
mount_on_startup=1
mount_removable=1
autorun=1

[desktop]
wallpaper_mode=crop
wallpaper_common=1
wallpaper=/usr/share/backgrounds/hyggshi/wallpaper.png
desktop_bg=#1a1b26
desktop_fg=#c0caf5
desktop_shadow=#15161e
show_wm_menu=1
sort=mtime
sort_type=descending
show_documents=0
show_trash=1
show_mounts=1

[ui]
always_show_tabs=0
max_tab_chars=32
win_width=860
win_height=540
splitter_pos=160
side_pane_mode=places
view_mode=icon
show_hidden=0
sort=name
sort_type=ascending
toolbar=newtab;navigation;home;
show_statusbar=1
pathbar_mode=buttons
