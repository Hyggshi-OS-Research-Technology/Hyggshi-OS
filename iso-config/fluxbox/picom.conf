# Picom configuration for Hyggshi OS Flex Edition (Slax-style)

# Backend & Rendering Engine
# backend xrender and use-damage false eliminate desktop icon loss / glitches when moving or spamming windows
backend = "xrender";
vsync = false;
use-damage = false;

# Shadows
shadow = true;
shadow-radius = 6;
shadow-opacity = 0.35;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'tint2'",
  "class_g = 'pcmanfm'",
  "class_g = 'Pcmanfm'",
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;

# Opacity (Transparency: keep every window 100% opaque so nothing is see-through)
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "100:_NET_WM_WINDOW_TYPE@:a *= 'NORMAL'",
  "100:_NET_WM_WINDOW_TYPE@:a *= 'DESKTOP'",
  "100:class_g = 'Pcmanfm'",
  "100:class_g = 'pcmanfm'",
  "100:class_g = 'tint2'"
];

# Rounded corners
corner-radius = 4;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'tint2'",
  "class_g = 'pcmanfm'",
  "class_g = 'Pcmanfm'"
];

# Wintypes
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 1.0; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; shadow = false; };
  dropdown_menu = { opacity = 1.0; shadow = false; };
};
