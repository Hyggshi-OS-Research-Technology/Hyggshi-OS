# Picom configuration for Hyggshi OS Flex Edition (Slax-style)
# Backend
backend = "xrender";
vsync = true;

# Shadows
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.5;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'tint2'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 10;

# Transparency / Opacity
inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = false;
focus-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'tint2'"
];

# Rounded corners
corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'tint2'"
];

# Wintypes
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.98; }
  dropdown_menu = { opacity = 0.98; }
};
