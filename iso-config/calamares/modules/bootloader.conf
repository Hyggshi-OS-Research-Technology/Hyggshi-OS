# Bootloader configuration. The bootloader is installed to allow
# the system to start (and pick one of the installed operating
# systems to run).
---
# Define which bootloader you want to use for EFI installations
# Possible options are 'grub', 'sb-shim' and 'systemd-boot'.
efiBootLoader: "grub"

# systemd-boot configuration files settings, set kernel and initramfs file names
# and amount of time before default selection boots
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"

# Optionally set the menu entry name and kernel name to use in systemd-boot.
# If not specified here, these settings will be taken from branding.desc.
#
# bootloaderEntryName: "Generic GNU/Linux"
# kernelLine: ", with Stable-Kernel"
# fallbackKernelLine:  ", with Stable-Kernel (fallback initramfs)"

# GRUB 2 binary names and boot directory
# Some distributions (e.g. Fedora) use grub2-* (resp. /boot/grub2/) names.
# These names are also used when using sb-shim, since that needs some
# GRUB functionality (notably grub-probe) to work. As needed, you may use
# complete paths like `/usr/bin/efibootmgr` for the executables.
#
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Optionally set the bootloader ID to use for EFI. This is passed to
# grub-install --bootloader-id.
#
efiBootloaderId: "hyggshi"

# QUAN TRỌNG VỀ SECURE BOOT (FIX LỖI TRÊN DELL/LENOVO/HP):
# Calamares mặc định nếu installEFIFallback = true sẽ copy grubx64.efi
# đè lên /boot/efi/EFI/BOOT/bootx64.efi.
# Vì grubx64.efi KHÔNG có chữ ký Microsoft UEFI CA, firmware của máy Dell
# (như Dell Vostro 3400) sẽ báo lỗi:
# "Operating System Loader has no signature. Incompatible with SecureBoot."
# Tắt cờ này để Calamares không đè grubx64.efi vào bootx64.efi.
# Module shellprocess@hyggshi-secureboot (chạy ngay sau bootloader) sẽ copy
# ĐÚNG file shimx64.efi (Microsoft-signed) vào EFI/BOOT/BOOTX64.EFI.
installEFIFallback: false
 
