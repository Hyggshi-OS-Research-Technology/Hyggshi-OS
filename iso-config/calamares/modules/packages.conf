---
# Hyggshi OS package installation backend.
# Installation profiles must not require the network for the default path.
backend: apt

# If there is no usable network connection, skip optional online package work
# instead of aborting the whole Calamares installation.
skip_if_no_internet: true

# Do not force apt-get update here. On a live ISO this can fail because the
# mirror is unavailable, captive, or the target has not finished its sources
# configuration yet. The installer can still use packages already available
# from the ISO/cache.
update_db: false
update_system: false

operations:
  - remove:
      - live-boot
      - live-boot-doc
      - live-tools
      - calamares
      - calamares-settings-debian
