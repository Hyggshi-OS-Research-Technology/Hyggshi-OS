---
# Trang License của Calamares. Các key HỢP LỆ của module license được định
# nghĩa bởi src/modules/license/license.schema.yaml của Calamares (giống
# nhau trên 3.2.x và 3.3.x, additionalProperties: false):
#     id, name, vendor, type, url, required, expand
#
# required: true là cách DUY NHẤT bắt người dùng tick "I accept the terms
#   and conditions above." trước khi bấm Next. Trong LicensePage.cpp:
#       m_isNextEnabled = checked || m_allLicensesOptional
#   và m_allLicensesOptional = (không entry nào required) -> nếu thiếu
#   key này (hoặc dùng key KHÔNG tồn tại như "isMandatory"/"isOptedIn"/
#   "file" từng dùng ở đây — schema không có, Calamares lặng lẽ bỏ qua
#   key lạ) thì checkbox bị HOÀN TOÀN BỎ QUA, Next luôn sáng và user skip
#   License vô tư. Đó chính là bug "chọn LICENSE nhưng installer làm ngơ".
#
# url dạng file:// -> nội dung hiển thị ngay trong installer (đọc được kể
#   cả khi cài offline, live USB không mạng); url http(s) -> nút "Open the
#   license agreement in browser". Một checkbox "I accept" ở cuối trang áp
#   cho MỌI entry required.
entries:
  - id:          "hyggshi-os-license"
    name:        "Hyggshi OS"
    vendor:      "Hyggshi OS Research Technology (HORT)"
    url:         "file:///usr/share/hyggshi-os/LICENSE.txt"
    required:    true
  - id:          "hyggshi-os-license-web"
    name:        "Hyggshi OS — license (online)"
    vendor:      "Hyggshi OS Research Technology (HORT)"
    url:         "https://hyggshi-os-website.pages.dev/license"
    required:    true
