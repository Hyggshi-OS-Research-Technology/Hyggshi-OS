---
# Hyggshi OS installation profile selector.
# Normal and Minimal do not depend on apt/network packages. The desktop set
# for those profiles should be part of the ISO image (or handled by a local
# Hyggshi OS metapackage during image creation).
mode: required
method: packages

labels:
  step: "Customize"
  step[vi]: "Tùy chỉnh"

default: normal

items:
  - id: full
    name: "Full Installation"
    name[vi]: "Cài đặt đầy đủ"
    description: "Normal Installation plus extra creative, communication, and virtualization software when those packages are available."
    description[vi]: "Bao gồm Cài đặt thông thường cùng phần mềm sáng tạo, liên lạc và ảo hóa bổ sung khi các gói này khả dụng."
    screenshot: ":/images/no-selection.png"
    packages:
      - thunderbird
      - krita
      - virt-manager
      - keepassxc

  - id: normal
    name: "Normal Installation"
    name[vi]: "Cài đặt thông thường"
    description: "Web browser, office software, utilities, media applications, and the standard Hyggshi OS desktop experience included by the ISO."
    description[vi]: "Trình duyệt web, phần mềm văn phòng, tiện ích, ứng dụng đa phương tiện và trải nghiệm desktop Hyggshi OS tiêu chuẩn đã có trong ISO."
    screenshot: ":/images/no-selection.png"
    packages: []

  - id: minimal
    name: "Minimal Installation"
    name[vi]: "Cài đặt tối giản"
    description: "Only the core Hyggshi OS desktop environment and essential system tools. Install more applications later."
    description[vi]: "Chỉ cài môi trường desktop Hyggshi OS cốt lõi và các công cụ hệ thống thiết yếu. Bạn có thể cài thêm ứng dụng sau."
    screenshot: ":/images/no-selection.png"
    packages: []
