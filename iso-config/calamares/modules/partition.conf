# SPDX-License-Identifier: CC0-1.0
# Hyggshi OS - Calamares partition module
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: EFI

userSwapChoices:
    - none
    - small
    - suspend
    - file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: false

initialPartitioningChoice: erase
initialSwapChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

# Kiểu bảng phân vùng mặc định khi chọn "Xóa đĩa" (Erase disk)
defaultPartitionTableType: gpt

# Cấu hình phân vùng tự động khi "Xóa đĩa" — đảm bảo Calamares luôn tạo phân vùng root '/'
# thay vì để ổ đĩa trống (unallocated), tránh rsync bị bung nhầm vào RAM /tmp
partitionLayout:
    - name: "rootfs"
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%
      minSize: 8G

# Tối thiểu cho Hyggshi OS (GiB)
requiredStorage: 15.0
