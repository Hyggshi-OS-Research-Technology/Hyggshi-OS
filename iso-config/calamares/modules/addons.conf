---
# Optional add-ons. These are intentionally optional online installs.
mode: optionalmultiple
method: packages

labels:
  step: "Additional Software"
  step[vi]: "Phần mềm bổ sung"

items:
  - id: updates
    name: "Download and install updates following installation"
    name[vi]: "Tải xuống và cài đặt các bản cập nhật sau khi cài đặt"
    description: "Install the latest available updates when a working package mirror is available."
    description[vi]: "Cài các bản cập nhật mới nhất khi package mirror hoạt động bình thường."
    screenshot: ":/images/no-selection.png"
    packages:
      - unattended-upgrades

  - id: media
    name: "Additional media formats"
    name[vi]: "Định dạng đa phương tiện bổ sung"
    description: "Install common multimedia codecs and extra media support."
    description[vi]: "Cài thêm codec đa phương tiện phổ biến và hỗ trợ media mở rộng."
    screenshot: ":/images/no-selection.png"
    packages:
      - ffmpeg

  - id: thunderbird
    name: "Thunderbird"
    description: "Email, newsfeed, chat, and calendaring client."
    screenshot: ":/images/no-selection.png"
    packages:
      - thunderbird

  - id: krita
    name: "Krita"
    description: "Professional digital painting and illustration application."
    screenshot: ":/images/no-selection.png"
    packages:
      - krita

  - id: virtmanager
    name: "Virtual Machine Manager"
    name[vi]: "Trình quản lý máy ảo"
    description: "Desktop interface for creating and managing virtual machines through libvirt."
    description[vi]: "Giao diện desktop để tạo và quản lý máy ảo thông qua libvirt."
    screenshot: ":/images/no-selection.png"
    packages:
      - virt-manager
